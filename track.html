<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Track Your Order · Fit Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..800;1,400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg-card:#ffffff;--bg-card2:#f7f7f7;--bg-hover:#f2f2f2;
  --border:#ebebeb;--border-hi:#d4d4d4;
  --accent:#0a0a0a;--accent-dim:#f2f2f2;--accent-mid:#6b6b6b;
  --red:#c00000;--red-bg:#fff5f5;--red-border:#ffd0d0;
  --green:#007a3a;--green-bg:#e8fff4;
  --blue:#0055cc;--blue-bg:#e8f4ff;
  --amber:#b45309;--amber-bg:#fff8e6;
  --text:#0a0a0a;--text-muted:#8c8c8c;--text-dim:#4a4a4a;
  --shadow:0 1px 4px rgba(0,0,0,.06);--shadow-md:0 4px 16px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.10);
  --radius:10px;--radius-sm:7px;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo-mark{width:30px;height:30px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-.5px}
.logo-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.hbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.hbtn:hover{background:var(--bg-hover)}

/* ── Sidebar ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;right:0;bottom:0;width:280px;max-width:84vw;background:#fff;z-index:41;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.sb-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-head b{font-size:15px}
.sb-body{padding:10px;flex:1}
.sb-link{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);color:var(--text);text-decoration:none;font-size:13.5px;font-weight:600}
.sb-link:hover{background:var(--bg-hover)}
.sb-link .ic{font-size:16px;width:20px;text-align:center}
.sb-foot{padding:16px 20px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-muted)}

.page-wrap{max-width:600px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);animation:fadeIn .25s ease}
.card+.card{margin-top:14px}

h2{font-size:19px;font-weight:800;color:var(--text);letter-spacing:-.3px;margin-bottom:5px}
p.sub{font-size:13px;color:var(--text-muted);margin-bottom:20px}

.tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:18px}
.tab{flex:1;padding:9px 10px;font-size:12.5px;font-weight:600;color:var(--text-muted);cursor:pointer;background:var(--bg-card2);border:none;transition:all .15s;text-align:center;font-family:inherit}
.tab.active{background:var(--accent);color:#fff}

.field{margin-bottom:13px}
label.lbl{display:block;font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.3px;margin-bottom:5px;text-transform:uppercase}
input,select,textarea{width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;color:var(--text);background:#fff;outline:none;transition:border-color .15s;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;cursor:pointer;transition:all .15s;border:none;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#222}
.btn-primary:active{background:#000;transform:translateY(1px)}
.btn-ghost{background:transparent;border:1.5px solid var(--border-hi);color:var(--text-dim)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:13px}
.alert-error{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)}

/* ── Horizontal stage stepper (croscrow-style) ── */
.stage-bar{display:flex;align-items:flex-start;margin:16px 0 4px}
.stage-step{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center}
.stage-step:not(:first-child)::before{content:'';position:absolute;top:4.5px;right:50%;width:100%;height:2px;background:var(--border);z-index:0}
.stage-step.done:not(:first-child)::before{background:var(--accent)}
.stage-dot{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--border-hi);z-index:1;margin-bottom:7px}
.stage-step.done .stage-dot{background:var(--accent);border-color:var(--accent)}
.stage-step.active .stage-dot{border-color:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,10,10,.25)}70%{box-shadow:0 0 0 6px rgba(10,10,10,0)}100%{box-shadow:0 0 0 0 rgba(10,10,10,0)}}
.stage-label{font-size:8px;font-weight:700;letter-spacing:.1px;text-transform:uppercase;color:var(--text-muted);line-height:1.3;padding:0 2px;word-break:break-word;max-width:100%}
.stage-step.done .stage-label,.stage-step.active .stage-label{color:var(--text)}
.rto-banner{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red);border-radius:var(--radius-sm);padding:10px 14px;font-size:12.5px;font-weight:600;margin:14px 0 4px}

/* ── Scan log ── */
.scanlog-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0 3px;border-top:1px dashed var(--border);margin-top:8px;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--text-muted);letter-spacing:.2px}
.scanlog-toggle:hover{color:var(--text)}
.scanlog-toggle .chev{transition:transform .2s;font-size:13px}
.scanlog-toggle.open .chev{transform:rotate(180deg)}
.scanlog{display:none;position:relative;max-height:320px;overflow-y:auto;margin-top:10px;padding-left:2px}
.scanlog.open{display:block}
.scanlog::before{content:'';position:absolute;left:5px;top:5px;bottom:5px;width:1.5px;background:var(--border)}
.sl-item{display:flex;gap:11px;padding:0 0 14px;position:relative}
.sl-item:last-child{padding-bottom:2px}
.sl-dot{width:7px;height:7px;border-radius:50%;background:var(--border-hi);flex-shrink:0;margin-top:4px;z-index:1;border:2px solid #fff}
.sl-item.latest .sl-dot{background:var(--text)}
.sl-item.delivered .sl-dot{background:var(--green)}
.sl-desc{font-size:12px;font-weight:600;color:var(--text-dim);line-height:1.4}
.sl-item.latest .sl-desc{color:var(--text)}
.sl-meta{font-size:10.5px;color:var(--text-muted);margin-top:1px}
.sl-more{font-size:11px;font-weight:700;color:var(--text-muted);padding:4px 0 0 18px;cursor:pointer}
.sl-more:hover{color:var(--text)}

.awb-row{background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}

/* ── Order list / badges ── */
.order-row{padding:13px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;border-radius:8px}
.order-row:last-child{border-bottom:none}
.order-row:hover{background:var(--bg-hover);margin:0 -14px;padding:13px 14px}

.stage-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700}
.sp-new{background:#f2f2f2;color:#555}
.sp-confirmed{background:var(--accent);color:#fff}
.sp-ready,.sp-pickup{background:#f0f0ff;color:#4433cc}
.sp-transit{background:var(--blue-bg);color:var(--blue)}
.sp-ofd{background:#fff4e6;color:#b45309}
.sp-delivered{background:var(--green-bg);color:var(--green)}
.sp-rto,.sp-cancelled{background:var(--red-bg);color:var(--red)}

/* ── Action grid (links out to /returns) ── */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.action-card{display:block;text-decoration:none;color:var(--text);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:16px 14px;transition:all .15s}
.action-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.action-ic{font-size:20px;margin-bottom:8px}
.action-t{font-size:13.5px;font-weight:700}
.action-s{font-size:11px;color:var(--text-muted);margin-top:2px}

footer{text-align:center;padding:28px 20px;font-size:11.5px;color:var(--text-muted)}
footer a{color:var(--text-dim);text-decoration:none;font-weight:600}

@media(max-width:600px){ .page-wrap{padding:16px 12px 40px} .card{padding:18px} }
</style>
</head>
<body>

<header>
  <a href="/track" class="logo">
    <div class="logo-mark">FC</div>
    <span class="logo-name">Fit Check</span>
  </a>
  <button class="hbtn" onclick="openSidebar()" aria-label="Menu">☰</button>
</header>

<div class="scrim" id="scrim" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sb-head"><b>Menu</b><button class="hbtn" onclick="closeSidebar()">✕</button></div>
  <div class="sb-body">
    <a class="sb-link" href="/track"><span class="ic">📦</span>Track My Order</a>
    <a class="sb-link" id="sbReturnsLink" href="/returns"><span class="ic">↩</span>Return &amp; Exchange</a>
    <a class="sb-link" href="https://wa.me/" target="_blank"><span class="ic">💬</span>WhatsApp Support</a>
    <a class="sb-link" href="mailto:support@fitcheck.com"><span class="ic">✉</span>Email Us</a>
  </div>
  <div class="sb-foot">Fit Check · thefitcheck.in</div>
</aside>

<div class="page-wrap" id="app">

  <div id="searchSection">
    <div class="card">
      <h2>Track Your Order</h2>
      <p class="sub">Enter your order number and email or phone to track.</p>

      <div class="tabs">
        <button class="tab active" id="tabSingle" onclick="switchTab('single')">Track by Order #</button>
        <button class="tab" id="tabAll" onclick="switchTab('all')">All My Orders</button>
      </div>

      <div id="formSingle">
        <div id="errSingle" class="alert alert-error" style="display:none"></div>
        <div class="field">
          <label class="lbl">Order Number</label>
          <input id="inputOrder" placeholder="#1234" onkeydown="if(event.key==='Enter')lookupOrder()"/>
        </div>
        <div class="field">
          <label class="lbl">Email or Phone</label>
          <input id="inputContact" placeholder="you@email.com or 9876543210" onkeydown="if(event.key==='Enter')lookupOrder()"/>
        </div>
        <button class="btn btn-primary btn-full" id="btnLookup" onclick="lookupOrder()">Track Order →</button>
      </div>

      <div id="formAll" style="display:none">
        <div id="errAll" class="alert alert-error" style="display:none"></div>
        <div class="field">
          <label class="lbl">Email or Phone</label>
          <input id="inputContactAll" placeholder="you@email.com or 9876543210" onkeydown="if(event.key==='Enter')lookupAll()"/>
        </div>
        <button class="btn btn-primary btn-full" id="btnAll" onclick="lookupAll()">Find My Orders →</button>
      </div>
    </div>
  </div>

  <div id="allOrdersSection" style="display:none">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <button class="btn btn-ghost btn-sm" onclick="resetAll()">← Back</button>
      <span style="font-size:13px;color:var(--text-muted)" id="allOrdersCount"></span>
    </div>
    <div class="card" id="allOrdersList"></div>
  </div>

  <div id="orderSection" style="display:none"></div>

</div>

<footer>
  <a href="/track">Track Another Order</a> · <a href="/returns">Return &amp; Exchange</a>
</footer>

<script>
const API = '';
let currentOrder = null;

function fmt(d){ return d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—'; }
function fmtMoney(n){ return '₹'+parseFloat(n||0).toLocaleString('en-IN'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('scrim').classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }

function stagePillClass(s){
  const map={delivered:'sp-delivered',transit:'sp-transit',ofd:'sp-ofd',pickup:'sp-pickup',ready:'sp-ready',rto:'sp-rto',confirmed:'sp-confirmed',cancelled:'sp-cancelled',new:'sp-new',misc:'sp-new'};
  return map[s]||'sp-new';
}
function stageLabel(s){
  const map={delivered:'Delivered',transit:'In Transit',ofd:'Out for Delivery',pickup:'Picked Up',ready:'Ready',rto:'RTO',confirmed:'Confirmed',cancelled:'Cancelled',new:'Processing',misc:'Processing'};
  return map[s]||'Processing';
}
function stageBadge(s){ return `<span class="stage-pill ${stagePillClass(s)}">${stageLabel(s)}</span>`; }

function rrStatusBadge(s){
  const map={pending:['sp-ready','Pending Review'],approved:['sp-delivered','Approved'],rejected:['sp-rto','Rejected'],in_progress:['sp-transit','In Progress'],completed:['sp-delivered','Completed']};
  const [cls,label]=map[s]||['sp-new',s];
  return `<span class="stage-pill ${cls}">${label}</span>`;
}

function switchTab(t){
  document.getElementById('tabSingle').className='tab'+(t==='single'?' active':'');
  document.getElementById('tabAll').className='tab'+(t==='all'?' active':'');
  document.getElementById('formSingle').style.display=t==='single'?'block':'none';
  document.getElementById('formAll').style.display=t==='all'?'block':'none';
}

async function lookupOrder(){
  const q=document.getElementById('inputOrder').value.trim();
  const contact=document.getElementById('inputContact').value.trim();
  const errEl=document.getElementById('errSingle');
  errEl.style.display='none';
  if(!q){errEl.textContent='Please enter your order number.';errEl.style.display='block';return;}
  if(!contact){errEl.textContent='Please enter your email or phone.';errEl.style.display='block';return;}
  const btn=document.getElementById('btnLookup');
  btn.disabled=true;btn.textContent='Looking up…';
  try{
    const r=await fetch(`${API}/track/order?q=${encodeURIComponent(q)}&contact=${encodeURIComponent(contact)}`);
    const d=await r.json();
    if(!r.ok){errEl.textContent=d.error||'Order not found.';errEl.style.display='block';return;}
    showOrderDetail(d);
  }catch(e){errEl.textContent='Something went wrong. Please try again.';errEl.style.display='block';}
  btn.disabled=false;btn.textContent='Track Order →';
}

async function lookupAll(){
  const contact=document.getElementById('inputContactAll').value.trim();
  const errEl=document.getElementById('errAll');
  errEl.style.display='none';
  if(!contact){errEl.textContent='Please enter your email or phone.';errEl.style.display='block';return;}
  const btn=document.getElementById('btnAll');
  btn.disabled=true;btn.textContent='Searching…';
  try{
    const r=await fetch(`${API}/track/my-orders?contact=${encodeURIComponent(contact)}`);
    const d=await r.json();
    if(!r.ok){errEl.textContent=d.error||'No orders found.';errEl.style.display='block';return;}
    showAllOrders(d.orders||[]);
  }catch(e){errEl.textContent='Something went wrong. Please try again.';errEl.style.display='block';}
  btn.disabled=false;btn.textContent='Find My Orders →';
}

function showAllOrders(orders){
  document.getElementById('searchSection').style.display='none';
  document.getElementById('allOrdersSection').style.display='block';
  document.getElementById('allOrdersCount').textContent=`${orders.length} order${orders.length!==1?'s':''} found`;
  const el=document.getElementById('allOrdersList');
  if(!orders.length){el.innerHTML='<div style="padding:24px;text-align:center;color:var(--text-muted)">No orders found.</div>';return;}
  el.innerHTML=orders.map(o=>`
    <div class="order-row" onclick="loadOrderById('${o.shopify_order_id}')">
      <div>
        <div style="font-weight:700;font-size:13.5px">${esc(o.order_name)}</div>
        <div style="font-size:11.5px;color:var(--text-muted);margin-top:2px">${fmt(o.created_at)} · ${esc(o.items_preview||'')}${(o.item_count||0)>2?'…':''}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        ${stageBadge(o.stage)}
        <div style="font-size:12.5px;font-weight:600;margin-top:4px">${fmtMoney(o.total)}</div>
      </div>
    </div>
  `).join('');
}

async function loadOrderById(id){
  try{
    const r=await fetch(`${API}/track/order?q=${id}&contact=na`);
    const d=await r.json();
    if(r.ok){document.getElementById('allOrdersSection').style.display='none';showOrderDetail(d);}
  }catch{}
}

async function refreshShipsagarStatus(orderId){
  const btn=document.getElementById('ssRefreshBtn');
  const box=document.getElementById('ssStatusBox');
  if(!box) return;
  if(btn){ btn.disabled=true; btn.textContent='Checking…'; }
  box.innerHTML='';
  try{
    const r=await fetch(`${API}/track/shipsagar-status?orderId=${orderId}`);
    const d=await r.json();
    let html='';
    if(!d.connected){ html=`<div style="font-size:12px;color:var(--text-muted);padding:10px 12px;background:var(--bg-card2);border-radius:8px">Tracking partner not connected yet.</div>`; }
    else if(!d.registered){ html=`<div style="font-size:12px;color:var(--text-muted);padding:10px 12px;background:var(--bg-card2);border-radius:8px">Tracking requested from courier partner — refresh in a few moments.</div>`; }
    else if(!d.status){ html=`<div style="font-size:12px;color:var(--amber);padding:10px 12px;background:var(--amber-bg);border:1px solid #f59e0b55;border-radius:8px">Tracking requested from courier partner — refresh in a few moments for live status.</div>`; }
    else { html=`<div style="font-size:12.5px;font-weight:700;padding:10px 12px;background:var(--green-bg);border:1px solid #22c55e40;border-radius:8px;color:var(--green)">${esc(d.status)}</div>`; }
    box.innerHTML=html;
  }catch(e){ box.innerHTML=`<div style="font-size:12px;color:var(--text-muted)">Could not check live status right now.</div>`; }
  if(btn){ btn.disabled=false; btn.textContent='↻ Refresh'; }
}

function fmtScanDate(d,t){
  if(!d) return '';
  const m=d.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  return m ? `${m[1]} ${m[2]} '${m[3].slice(2)}${t?', '+t:''}` : `${d}${t?', '+t:''}`;
}
async function loadScanLog(orderId){
  const wrap=document.getElementById('scanlogWrap');
  if(!wrap) return;
  try{
    const r=await fetch(`${API}/track/scan-history?orderId=${orderId}`);
    const d=await r.json();
    const scans=d.scans||[];
    if(!scans.length){ wrap.innerHTML=''; return; }
    const shown=scans.slice(0,4), rest=scans.slice(4);
    const rowHtml=(s,i)=>`
      <div class="sl-item${i===0?' latest':''}${/deliver/i.test(s.desc||'')?' delivered':''}">
        <div class="sl-dot"></div>
        <div>
          <div class="sl-desc">${esc(s.desc||'Update')}</div>
          <div class="sl-meta">${fmtScanDate(s.date,s.time)}${s.loc?' · '+esc(s.loc):''}</div>
        </div>
      </div>`;
    wrap.innerHTML=`
      <div class="scanlog-toggle open" id="scanlogToggle" onclick="toggleScanlog()">
        <span>Tracking log · ${scans.length} update${scans.length!==1?'s':''}</span>
        <span class="chev">▾</span>
      </div>
      <div class="scanlog open" id="scanlogBody">
        ${shown.map(rowHtml).join('')}
        <div id="scanlogRest" style="display:none">${rest.map((s,i)=>rowHtml(s,i+4)).join('')}</div>
        ${rest.length?`<div class="sl-more" id="scanlogMore" onclick="event.stopPropagation();showMoreScans()">+ ${rest.length} more update${rest.length!==1?'s':''}</div>`:''}
      </div>`;
  }catch(e){ wrap.innerHTML=''; }
}
function toggleScanlog(){ document.getElementById('scanlogToggle')?.classList.toggle('open'); document.getElementById('scanlogBody')?.classList.toggle('open'); }
function showMoreScans(){ const r=document.getElementById('scanlogRest'),m=document.getElementById('scanlogMore'); if(r)r.style.display='block'; if(m)m.style.display='none'; }

function resetAll(){
  document.getElementById('searchSection').style.display='block';
  document.getElementById('allOrdersSection').style.display='none';
  document.getElementById('orderSection').style.display='none';
}

const STAGE_STEPS=['confirmed','ready','pickup','transit','ofd','delivered'];
const STAGE_STEP_LABEL={confirmed:'Confirmed',ready:'Packed',pickup:'Picked Up',transit:'Transit',ofd:'Out for Delivery',delivered:'Delivered'};
function renderStageBar(stage){
  if(stage==='cancelled') return `<div class="rto-banner">✕ This order has been cancelled.</div>`;
  if(stage==='rto') return `<div class="rto-banner">🔄 Shipment is being returned to origin.</div>`;
  const idx=STAGE_STEPS.indexOf(stage);
  return `<div class="stage-bar">${STAGE_STEPS.map((s,i)=>{
    let cls='pending';
    if(i<idx) cls='done'; else if(i===idx) cls='active';
    return `<div class="stage-step ${cls}"><div class="stage-dot"></div><div class="stage-label">${STAGE_STEP_LABEL[s]}</div></div>`;
  }).join('')}</div>`;
}

function returnsLink(order, action){
  const contact=order.customer_email||order.customer_phone||'na';
  return `/returns?order=${encodeURIComponent(order.order_name.replace(/^#/,''))}&contact=${encodeURIComponent(contact)}${action?'&action='+action:''}`;
}

function showOrderDetail(order){
  currentOrder=order;
  document.getElementById('searchSection').style.display='none';
  document.getElementById('allOrdersSection').style.display='none';
  document.getElementById('sbReturnsLink').href=returnsLink(order);
  const el=document.getElementById('orderSection');
  el.style.display='block';

  const trackUrl=order.tracking_url||(order.awb?`https://shiprocket.co/tracking/${order.awb}`:'');

  const itemsHtml=(order.items||[]).map(it=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px">
      <div>
        <div style="font-weight:600">${esc(it.title)}</div>
        ${it.variant_title?`<div style="color:var(--text-muted);font-size:11.5px">${esc(it.variant_title)}</div>`:''}
        ${it.sku?`<div style="color:var(--text-muted);font-size:10.5px;font-family:monospace">${esc(it.sku)}</div>`:''}
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-weight:600">${fmtMoney(it.price)}</div>
        <div style="font-size:11.5px;color:var(--text-muted)">Qty: ${it.qty}</div>
      </div>
    </div>
  `).join('');

  const existingRRs=(order.return_requests||[]).map(rr=>`
    <div style="padding:10px 12px;background:var(--bg-card2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:12.5px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-weight:600">${rr.type==='exchange'?'Exchange':'Return'} Request</div>
        ${rrStatusBadge(rr.status)}
      </div>
      <div style="color:var(--text-muted);font-size:11.5px;margin-top:3px">${esc(rr.request_id)} · ${fmt(rr.created_at)}</div>
      ${rr.reason?`<div style="color:var(--text-muted);font-size:11.5px;margin-top:2px">Reason: ${esc(rr.reason)}</div>`:''}
    </div>
  `).join('');

  const notCancelled = !['cancelled','rto'].includes(order.stage||'');
  const exchangeOk = order.exchange_enabled!==false;
  const returnOk = order.return_enabled!==false;
  const canRR = notCancelled && (exchangeOk||returnOk);

  el.innerHTML=`
    <button class="btn btn-ghost btn-sm" style="margin-bottom:14px" onclick="document.getElementById('searchSection').style.display='block';document.getElementById('orderSection').style.display='none'">← Track Another</button>

    <div class="card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div>
          <div style="font-size:19px;font-weight:800">${esc(order.order_name)}</div>
          <div style="font-size:12.5px;color:var(--text-muted);margin-top:3px">Placed ${fmt(order.created_at)}</div>
        </div>
        ${stageBadge(order.stage)}
      </div>

      ${order.awb?`
        <div class="awb-row">
          <div>
            <div style="font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px">Tracking</div>
            <div style="font-size:14px;font-weight:700;font-family:monospace;margin-top:2px">${esc(order.awb)}</div>
            ${order.courier?`<div style="font-size:11.5px;color:var(--text-muted)">${esc(order.courier)}</div>`:''}
          </div>
          <div style="display:flex;gap:7px;align-items:center">
            <button class="btn btn-ghost btn-sm" id="ssRefreshBtn" onclick="refreshShipsagarStatus('${order.shopify_order_id}')">↻ Refresh</button>
            ${trackUrl?`<a href="${trackUrl}" target="_blank" class="btn btn-primary btn-sm">Track →</a>`:''}
          </div>
        </div>
        <div id="ssStatusBox" style="margin-bottom:4px"></div>
      `:''}

      ${renderStageBar(order.stage||'confirmed')}
      ${order.awb?`<div id="scanlogWrap"></div>`:''}
    </div>

    <div class="card">
      <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Order Items</div>
      ${itemsHtml}
    </div>

    ${existingRRs?`<div class="card"><div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Return / Exchange Requests</div>${existingRRs}</div>`:''}

    ${canRR?`
    <div class="card">
      <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Need Help?</div>
      <div style="font-size:14.5px;font-weight:700;margin-bottom:3px">Return or Exchange</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:14px">Not happy with your order? We'll make it right.</div>
      <div class="action-grid">
        ${exchangeOk?`<a class="action-card" href="${returnsLink(order,'exchange')}"><div class="action-ic">⇄</div><div class="action-t">Exchange</div><div class="action-s">Swap for a different size</div></a>`:''}
        ${returnOk?`<a class="action-card" href="${returnsLink(order,'return')}"><div class="action-ic">↩</div><div class="action-t">Return</div><div class="action-s">Send it back</div></a>`:''}
      </div>
    </div>
    `:`
    <div class="card" style="text-align:center;padding:20px">
      <div style="font-size:22px;margin-bottom:8px">💬</div>
      <div style="font-weight:600;margin-bottom:4px">Need Help?</div>
      <div style="font-size:12.5px;color:var(--text-muted)">For any queries, please <a href="mailto:support@fitcheck.com" style="color:var(--accent)">contact us</a>.</div>
    </div>
    `}
  `;
  if(order.awb) loadScanLog(order.shopify_order_id);
}

(function(){
  const p=new URLSearchParams(window.location.search);
  if(p.get('order')){
    document.getElementById('inputOrder').value=p.get('order');
    const c=p.get('contact')||p.get('email');
    if(c) document.getElementById('inputContact').value=c;
    if(p.get('order') && (p.get('contact')||p.get('email'))) lookupOrder();
  }
})();
</script>
</body>
