function FlowCards({ orders }) {
  const st = {};
  const pay = { prepaid:{d:0,n:0,rto:0,del:0}, cod:{d:0,n:0,rto:0,del:0} };
  let total = 0;
  const base = () => ({ c:0, r:0 });
  for (const o of orders) {
    const s = o._stage || 'new', p = o.total_price || 0;
    const e = st[s] || (st[s] = base()); e.c++; e.r += p; total++;
    const isPre = (o.financial_status||'').toLowerCase()==='paid';
    const b = isPre ? pay.prepaid : pay.cod;
    if (['ready','pickup','transit','ofd','ndr','delivered','rto'].includes(s)) b.d++;
    if (s==='delivered') b.del++; if (s==='rto') b.rto++; b.n++;
  }
  const g = k => st[k] || {c:0,r:0};
  const sum = ks => ks.reduce((a,k)=>({c:a.c+g(k).c,r:a.r+g(k).r}),{c:0,r:0});
  const DISP = ['ready','pickup','transit','ofd','ndr','delivered','rto'];
  const PEND = ['new','confirmed','partial_collected','hold','misc'];
  const disp = sum(DISP), pend = sum(PEND), canc = g('cancelled');
  const active = total - canc.c;
  const del = g('delivered'), rto = g('rto');
  const inflight = sum(['ready','pickup','transit','ofd','ndr']);
  const pc = (n,d) => d ? n/d*100 : 0;
  const dispRate = pc(disp.c,active), delRate = pc(del.c,disp.c), rtoRate = pc(rto.c,disp.c);
  const settled = del.c + rto.c;
  const rtoSettled = pc(rto.c,settled);
  const Row = ({icon,label,c,r,of,color}) => (
    <div className="fr">
      <span className="fr-l">{icon} {label}</span>
      <span className="fr-b"><i style={{width:`${Math.min(100,pc(c,of))}%`,background:color}}/></span>
      <span className="fr-c" style={{color}}>{c.toLocaleString()}</span>
      <span className="fr-p">{pc(c,of).toFixed(0)}%</span>
      <span className="fr-r">{r>0?'₹'+compact(r):''}</span>
    </div>
  );
  const Mini = ({l,v,c}) => <div className="mini" style={{'--c':c}}><div className="mini-l">{l}</div><div className="mini-v">{v}</div></div>;
  const Head = ({icon,title,pill,pc:pcol}) => <div className="bx-h"><span>{icon} {title}</span>{pill && <em style={{'--c':pcol}}>{pill}</em>}</div>;
  const riskProj = rtoSettled/100 * inflight.r;
  const gap = (a,b) => (a-b);
  return (
    <div className="grid g3">
      <div className="bx" style={{'--c':'var(--orange)'}}>
        <Head icon="📦" title="Dispatch rate" pill={`${disp.c.toLocaleString()} of ${active.toLocaleString()} active`} pc="var(--orange)"/>
        <div className="bx-big"><CountUp value={dispRate} format={v=>v.toFixed(1)+'%'}/></div>
        <div className="bar"><div style={{width:`${dispRate}%`,background:'var(--orange)'}}/></div>
        <div className="minis">
          <Mini l="Dispatched value" v={'₹'+compact(disp.r)} c="var(--green)"/>
          <Mini l="Pending value" v={'₹'+compact(pend.r)} c="var(--yellow)"/>
        </div>
        <div className="bx-sub">✅ Dispatched · {disp.c.toLocaleString()}</div>
        <Row icon="📦" label="Ready to ship" c={g('ready').c} r={g('ready').r} of={disp.c} color="var(--blue)"/>
        <Row icon="🛵" label="Picked up" c={g('pickup').c} r={g('pickup').r} of={disp.c} color="var(--purple)"/>
        <Row icon="🚚" label="In transit" c={g('transit').c} r={g('transit').r} of={disp.c} color="var(--cyan)"/>
        <Row icon="🏍️" label="Out for deliv." c={g('ofd').c} r={g('ofd').r} of={disp.c} color="var(--indigo)"/>
        <Row icon="⚠️" label="NDR" c={g('ndr').c} r={g('ndr').r} of={disp.c} color="var(--orange)"/>
        <div className="bx-sub" style={{marginTop:14}}>⏳ Waiting to ship · {pend.c.toLocaleString()}</div>
        <Row icon="🆕" label="New" c={g('new').c} r={g('new').r} of={pend.c} color="var(--text-muted)"/>
        <Row icon="✔️" label="Confirmed" c={g('confirmed').c} r={g('confirmed').r} of={pend.c} color="var(--indigo)"/>
        <Row icon="₹" label="Partial paid" c={g('partial_collected').c} r={g('partial_collected').r} of={pend.c} color="var(--orange)"/>
        <Row icon="⏸️" label="On hold" c={g('hold').c} r={g('hold').r} of={pend.c} color="var(--yellow)"/>
        <div className="bx-foot">Overall fulfilment <b>{pc(disp.c,total).toFixed(1)}%</b> · {canc.c.toLocaleString()} cancelled ({'₹'+compact(canc.r)})</div>
      </div>

      <div className="bx" style={{'--c':'var(--green)'}}>
        <Head icon="✅" title="Delivery rate" pill={`${del.c.toLocaleString()} of ${disp.c.toLocaleString()} dispatched`} pc="var(--green)"/>
        <div className="bx-big"><CountUp value={delRate} format={v=>v.toFixed(1)+'%'}/></div>
        <div className="bar"><div style={{width:`${delRate}%`,background:'var(--green)'}}/></div>
        <div className="minis">
          <Mini l="Delivered value" v={'₹'+compact(del.r)} c="var(--green)"/>
          <Mini l="Still in motion" v={'₹'+compact(inflight.r)} c="var(--cyan)"/>
        </div>
        <div className="bx-sub">Outcome of {disp.c.toLocaleString()} dispatched</div>
        <Row icon="✅" label="Delivered" c={del.c} r={del.r} of={disp.c} color="var(--green)"/>
        <Row icon="🚚" label="On the way" c={g('pickup').c+g('transit').c+g('ofd').c} r={g('pickup').r+g('transit').r+g('ofd').r} of={disp.c} color="var(--cyan)"/>
        <Row icon="📦" label="Not picked yet" c={g('ready').c} r={g('ready').r} of={disp.c} color="var(--blue)"/>
        <Row icon="⚠️" label="NDR" c={g('ndr').c} r={g('ndr').r} of={disp.c} color="var(--orange)"/>
        <Row icon="↩️" label="RTO" c={rto.c} r={rto.r} of={disp.c} color="var(--red)"/>
        <div className="bx-sub" style={{marginTop:14}}>Delivery rate by payment</div>
        {[['💳','Prepaid',pay.prepaid,'var(--green)'],['💵','COD',pay.cod,'var(--yellow)']].map(([ic,l,b,col])=>(
          <div key={l} className="split">
            <span>{ic} {l}</span>
            <span className="fr-b" style={{flex:1}}><i style={{width:`${pc(b.del,b.d)}%`,background:col}}/></span>
            <b style={{color:col}}>{pc(b.del,b.d).toFixed(0)}%</b>
            <span className="fr-p">{b.del}/{b.d}</span>
          </div>
        ))}
        <div className="bx-foot">Of <b>all {total.toLocaleString()}</b> orders · <b>{pc(del.c,total).toFixed(1)}%</b> delivered</div>
      </div>

      <div className="bx" style={{'--c':'var(--red)'}}>
        <Head icon="↩️" title="RTO & risk" pill={rtoRate>15?'Above 15% target':rtoRate>10?'Watch closely':'Healthy'} pc={rtoRate>15?'var(--red)':rtoRate>10?'var(--yellow)':'var(--green)'}/>
        <div className="bx-big" style={{color:rtoRate>15?'var(--red)':rtoRate>10?'var(--yellow)':'var(--green)'}}><CountUp value={rtoRate} format={v=>v.toFixed(1)+'%'}/></div>
        <div className="bar"><div style={{width:`${Math.min(100,rtoRate*3.33)}%`,background:rtoRate>15?'var(--red)':rtoRate>10?'var(--yellow)':'var(--green)'}}/></div>
        <div className="bx-note">{rto.c.toLocaleString()} RTO of {disp.c.toLocaleString()} dispatched · target under 15%</div>
        <div className="minis">
          <Mini l="Lost to RTO" v={'₹'+compact(rto.r)} c="var(--red)"/>
          <Mini l="Cancelled value" v={'₹'+compact(canc.r)} c="var(--text-muted)"/>
        </div>
        <div className="bx-sub">RTO rate by payment</div>
        {[['💵','COD',pay.cod,'var(--yellow)'],['💳','Prepaid',pay.prepaid,'var(--green)']].map(([ic,l,b,col])=>(
          <div key={l} className="split">
            <span>{ic} {l}</span>
            <span className="fr-b" style={{flex:1}}><i style={{width:`${Math.min(100,pc(b.rto,b.d)*3.33)}%`,background:col}}/></span>
            <b style={{color:pc(b.rto,b.d)>15?'var(--red)':col}}>{pc(b.rto,b.d).toFixed(1)}%</b>
            <span className="fr-p">{b.rto}/{b.d}</span>
          </div>
        ))}
        <div className="bx-sub" style={{marginTop:14}}>Open risk</div>
        <Row icon="⚠️" label="NDR" c={g('ndr').c} r={g('ndr').r} of={Math.max(1,inflight.c)} color="var(--orange)"/>
        <Row icon="🚚" label="In flight" c={inflight.c} r={inflight.r} of={Math.max(1,disp.c)} color="var(--cyan)"/>
        <div className="risk">
          <div><span>Likely to bounce</span><b style={{color:'var(--red)'}}>₹{compact(riskProj)}</b></div>
          <div><span>Likely to convert</span><b style={{color:'var(--green)'}}>₹{compact(Math.max(0,inflight.r-riskProj))}</b></div>
        </div>
        <div className="bx-foot">Projection: in-flight value × your {rtoSettled.toFixed(0)}% RTO rate on settled orders (delivered + RTO)</div>
      </div>
    </div>
  );
}

function Dashboard({ active=true }) {
  const lastLoad = useRef(0);
  const [stats,setStats] = useState(null);
  const [prev,setPrev] = useState(null);
  const [orders,setOrders] = useState([]);
  const [loading,setLoading] = useState(true);
  const [audience,setAudience] = useState(null);
  const [ads,setAds] = useState(null);
  const [adsErr,setAdsErr] = useState('');
  const [metric,setMetric] = useState('revenue');
  const now = new Date();
  const [from,setFrom] = useState(()=>new Date(now-29*86400000).toISOString().slice(0,10));
  const [to,setTo]     = useState(()=>now.toISOString().slice(0,10));

  const load = useCallback(async (f,t,silent) => {
    if (!silent) setLoading(true);
    try {
      const len = Math.round((new Date(t)-new Date(f))/86400000)+1;
      const pf = new Date(new Date(f)-len*86400000).toISOString().slice(0,10);
      const pt = new Date(new Date(f)-86400000).toISOString().slice(0,10);
      const [s,o] = await Promise.all([
        apiFetch(`/orders/stats?from=${f}&to=${t}`),
        apiFetch(`/orders?from=${f}&to=${t}`),
      ]);
      setStats(s); setOrders(o.orders||[]);
      apiFetch(`/orders/stats?from=${pf}&to=${pt}`).then(setPrev).catch(()=>setPrev(null));
      apiFetch(`/orders/audience?from=${f}&to=${t}`).then(setAudience).catch(()=>{});
      if (!silent) { setAds(null); }
      setAdsErr('');
      apiFetch(`/admin/meta-ads/insights?from=${f}&to=${t}`).then(setAds).catch(e=>setAdsErr(e.message));
    } finally { setLoading(false); lastLoad.current = Date.now(); }
  }, []);
  useEffect(()=>{ load(from,to); },[from,to]);
  useEffect(()=>{ if (active && lastLoad.current && Date.now()-lastLoad.current > 60000) load(from,to,true); },[active]);

  const s = stats || {};
  const T = s.total || 1;
  const pct = n => ((n||0)/T*100).toFixed(1);
  const dispatched = (s.ready||0)+(s.pickup||0)+(s.transit||0)+(s.ofd||0)+(s.delivered||0)+(s.rto||0)+(s.ndr||0);
  const dispatchRate = dispatched/Math.max(1,T-(s.cancelled||0))*100, deliveryRate = (s.delivered||0)/T*100, rtoRate = (s.rto||0)/T*100, cancelRate = (s.cancelled||0)/T*100;
  const dl = (a,b) => (b ? (a-b)/b*100 : null);

  const series = useMemo(()=>buildSeries(orders,from,to),[orders,from,to]);
  const sortedOrders = useMemo(()=>[...orders].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)),[orders]);

  const derived = useMemo(()=>{
    const products = new Map(), cities = new Map(), custCount = new Map();
    const payRto = { cod:[0,0], prepaid:[0,0] };
    const stuck = [];
    const nowMs = Date.now();
    for (const o of orders) {
      for (const li of (o.line_items||[])) {
        const e = products.get(li.title) || { title:li.title, pid:li.product_id, qty:0, revenue:0 };
        e.qty += li.quantity||1; e.revenue += (li.price||0)*(li.quantity||1); products.set(li.title,e);
      }
      const geo = o.shipping_address?.province || o.shipping_address?.city;
      if (geo) { const e = cities.get(geo)||{name:geo,total:0,delivered:0,rto:0}; e.total++; if(o._stage==='delivered')e.delivered++; if(o._stage==='rto')e.rto++; cities.set(geo,e); }
      const em = o.email || o.customer?.email; if (em) custCount.set(em,(custCount.get(em)||0)+1);
      const isPre = (o.financial_status||'').toLowerCase()==='paid'; const bucket = isPre?payRto.prepaid:payRto.cod;
      bucket[0]++; if (o._stage==='rto') bucket[1]++;
      const days = (nowMs-new Date(o.created_at))/86400000;
      const st = o._stage;
      let issue=null, key=null;
      if (['new','confirmed','partial_collected','hold'].includes(st) && days>=2) { issue='Awaiting dispatch'; key='dispatch'; }
      else if (st==='ready' && days>=3) { issue='Ready, not picked up'; key='pickup'; }
      else if (['pickup','transit'].includes(st) && days>=8) { issue='Slow in transit'; key='transit'; }
      else if (st==='ndr') { issue='Delivery attempt failed'; key='ndr'; }
      else if (st==='ofd' && days>=10) { issue='Stuck out for delivery'; key='ofd'; }
      if (issue) stuck.push({ o, days:Math.floor(days), issue, key });
    }
    const repeat = [...custCount.values()].filter(v=>v>1).length;
    return {
      topProducts:[...products.values()].sort((a,b)=>b.qty-a.qty).slice(0,10),
      topCities:[...cities.values()].sort((a,b)=>b.total-a.total).slice(0,8),
      geoCovered:[...cities.values()].reduce((a,c)=>a+c.total,0),
      repeatRate: custCount.size ? repeat/custCount.size*100 : 0,
      payRto, stuck:stuck.sort((a,b)=>b.days-a.days),
    };
  },[orders]);

  const [openOrder,setOpenOrder] = useState(null);
  const [attnKey,setAttnKey] = useState('all');
  const [attnPay,setAttnPay] = useState('all');
  const [imgs,setImgs] = useState({});
  const topIds = derived.topProducts.map(p=>p.pid).filter(Boolean).join(',');
  useEffect(()=>{ if(topIds) apiFetch(`/admin/product-images?ids=${topIds}`).then(setImgs).catch(()=>{}); },[topIds]);

  const shopBook = useMemo(()=>{
    let cancelled=0, rto=0, delivered=0, deliveredOrders=0;
    for (const o of orders) { const p=o.total_price||0; if(o._stage==='cancelled')cancelled+=p; else if(o._stage==='rto')rto+=p; else if(o._stage==='delivered'){delivered+=p;deliveredOrders++;} }
    return { revenue:s.revenue||0, orders:s.total||0, cancelled, rto, delivered, deliveredOrders };
  },[orders,stats]);

  const wow = useMemo(()=>{
    if (series.length<14 || series[0].monthly) return null;
    const sum = arr => arr.reduce((x,d)=>x+d.revenue,0);
    const l7 = sum(series.slice(-7)), p7 = sum(series.slice(-14,-7));
    return p7 ? (l7-p7)/p7*100 : null;
  },[series]);
  const payKey = o => { const f=(o.financial_status||'').toLowerCase(); return f==='paid'?'prepaid':f==='partially_paid'?'pp':'cod'; };
  const attnBase = derived.stuck.filter(x=>attnPay==='all'||payKey(x.o)===attnPay);
  const attnCounts = { all:attnBase.length };
  attnBase.forEach(x=>{ attnCounts[x.key]=(attnCounts[x.key]||0)+1; });
  const attnList = attnBase.filter(x=>attnKey==='all'||x.key===attnKey);
  const attnValue = attnList.reduce((s,x)=>s+(x.o.total_price||0),0);
  const ATTN = [['all','All','var(--text)'],['dispatch','Not dispatched','var(--yellow)'],['pickup','Not picked up','var(--blue)'],['transit','Slow in transit','var(--cyan)'],['ndr','NDR','var(--orange)'],['ofd','Stuck OFD','var(--red)']];

  const bestDay = series.length ? [...series].sort((a,b)=>b.revenue-a.revenue)[0] : null;
  const avgPerDay = series.length ? (s.revenue||0)/series.length : 0;
  const hourCounts = Array(24).fill(0); orders.forEach(o=>hourCounts[new Date(o.created_at).getHours()]++);
  const peakHour = hourCounts.indexOf(Math.max(...hourCounts));
  const hourLbl = h => `${h%12||12}${h<12?'am':'pm'}`;

  const insights = [];
  if (orders.length) {
    const codR = derived.payRto.cod[0] ? derived.payRto.cod[1]/derived.payRto.cod[0]*100 : 0;
    const preR = derived.payRto.prepaid[0] ? derived.payRto.prepaid[1]/derived.payRto.prepaid[0]*100 : 0;
    if (derived.payRto.cod[0] && derived.payRto.prepaid[0]) insights.push({icon:'⚖️',tone:'var(--orange)',badge:'RTO Pattern',title:`COD orders return ${codR.toFixed(1)}% vs ${preR.toFixed(1)}% for prepaid`,detail: codR>preR ? `Nudging COD buyers to prepay could save ~${Math.round((codR-preR)/100*derived.payRto.cod[0])} returns.` : 'COD is performing on par with prepaid.'});
    if (derived.stuck.length) insights.push({icon:'🚨',tone:'var(--red)',badge:'Needs Action',title:`${derived.stuck.length} orders are stuck or delayed`,detail:`Oldest is ${derived.stuck[0].o.name}, ${derived.stuck[0].days} days — ${derived.stuck[0].issue.toLowerCase()}.`});
    if (derived.topProducts[0]) insights.push({icon:'🔥',tone:'var(--purple)',badge:'Bestseller',title:derived.topProducts[0].title,detail:`${derived.topProducts[0].qty} units sold · ${fmtMoney(derived.topProducts[0].revenue)} revenue this period.`});
    if (Math.max(...hourCounts)>0) insights.push({icon:'⏰',tone:'var(--cyan)',badge:'Peak Hour',title:`Most orders land around ${hourLbl(peakHour)}`,detail:'Schedule drops, stories and WhatsApp pushes 30 minutes before this window.'});
    if (derived.repeatRate>0) insights.push({icon:'💎',tone:'var(--green)',badge:'Loyalty',title:`${derived.repeatRate.toFixed(1)}% of customers ordered more than once`,detail:'Repeat buyers are your cheapest revenue — consider a thank-you code.'});
    if (prev && prev.revenue) { const g = dl(s.revenue||0,prev.revenue); insights.push({icon:g>=0?'📈':'📉',tone:g>=0?'var(--green)':'var(--red)',badge:'Momentum',title:`Revenue ${g>=0?'up':'down'} ${Math.abs(g).toFixed(0)}% vs previous period`,detail:`${fmtMoney(s.revenue||0)} now vs ${fmtMoney(prev.revenue)} before.`}); }
  }

  const ticker = orders.length ? [
    ...sortedOrders.slice(0,4).map(o=>({tag:'ORDER',c:'var(--indigo)',t:<><b>{o.name}</b> · {custName(o)} · {fmtMoney(o.total_price)} · {timeAgo(o.created_at)}</>})),
    {tag:'REVENUE',c:'var(--green)',t:<><b>{fmtMoney(s.revenue||0)}</b> across {(s.total||0).toLocaleString()} orders</>},
    ...(derived.stuck.length?[{tag:'URGENT',c:'var(--red)',t:<><b>{derived.stuck.length}</b> orders need attention</>}]:[]),
    {tag:'DELIVERY',c:'var(--cyan)',t:<><b>{deliveryRate.toFixed(1)}%</b> delivered · <b>{rtoRate.toFixed(1)}%</b> RTO</>},
    ...(derived.topProducts[0]?[{tag:'TRENDING',c:'var(--purple)',t:<><b>{derived.topProducts[0].title}</b> leading with {derived.topProducts[0].qty} units</>}]:[]),
  ] : [];

  const hr = now.getHours();
  const greet = hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  const revS = series.map(d=>d.revenue), ordS = series.map(d=>d.orders);

  return (
    <div>
      <div className="d-head">
        <div>
          <div className="d-hello">{greet}, <span>{brand()}</span></div>
          <div className="d-sub">Here’s how your store is performing — {new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div>
        </div>
        <DateRangePicker from={from} to={to} onChange={(f,t)=>{setFrom(f);setTo(t);}} />
      </div>

      {loading ? (
        <div>
          <div className="kpis">{Array.from({length:8}).map((_,i)=><div key={i} className="skel" style={{height:118}}/>)}</div>
          <div className="skel" style={{height:340,marginBottom:14}}/>
          <div className="grid g3">{[0,1,2].map(i=><div key={i} className="skel" style={{height:170}}/>)}</div>
        </div>
      ) : <>
        {ticker.length>0 && (
          <div className="ticker"><div className="ticker-in">
            {[...ticker,...ticker].map((k,i)=>(<div className="tk" key={i}><i style={{background:`color-mix(in srgb,${k.c} 14%,transparent)`,color:k.c}}>{k.tag}</i><span>{k.t}</span></div>))}
          </div></div>
        )}

        <div className="kpis">
          <Kpi label="Revenue" value={s.revenue||0} format={v=>fmtMoney(Math.round(v))} color="var(--indigo)" icon="💰" delta={prev?dl(s.revenue||0,prev.revenue):null} sub="vs previous period" spark={revS}/>
          <Kpi label="Orders" value={s.total||0} format={v=>Math.round(v).toLocaleString()} color="var(--text)" icon="📦" delta={prev?dl(s.total||0,prev.total):null} sub="vs previous period" spark={ordS}/>
          <Kpi label="Avg Order Value" value={s.aov||0} format={v=>fmtMoney(Math.round(v))} color="var(--cyan)" icon="🧾" delta={prev?dl(s.aov||0,prev.aov):null} sub="per order"/>
          <Kpi label="Delivered" value={s.delivered||0} format={v=>Math.round(v).toLocaleString()} color="var(--green)" icon="✅" delta={prev?dl(s.delivered||0,prev.delivered):null} sub={`${deliveryRate.toFixed(1)}% of orders`}/>
          <Kpi label="Dispatched" value={dispatched} format={v=>Math.round(v).toLocaleString()} color="var(--orange)" icon="🚀" sub={`${dispatchRate.toFixed(1)}% dispatch rate`}/>
          <Kpi label="Pending" value={s.pending||0} format={v=>Math.round(v).toLocaleString()} color="var(--yellow)" icon="⏳" sub={`${fmtMoney(s.revenue_pending||0)} waiting`}/>
          <Kpi label="RTO" value={s.rto||0} format={v=>Math.round(v).toLocaleString()} color="var(--red)" icon="↩️" sub={`${rtoRate.toFixed(1)}% · ${fmtMoney(s.revenue_rto||0)} lost`}/>
          <Kpi label="Repeat Buyers" value={derived.repeatRate} format={v=>v.toFixed(1)+'%'} color="var(--purple)" icon="💎" sub="ordered again"/>
        </div>

        <div className="grid g21">
          <div className="panel">
            <div className="panel-h">
              <div><div className="panel-t">Revenue Intelligence</div><div className="panel-m">{series.length>0 && (series.length>90?'Monthly':'Daily')} revenue &amp; orders · hover for details</div></div>

            </div>
            <RevBarChart series={series}/>
            <div className="pills">
              {bestDay && bestDay.revenue>0 && <div className="pill">🏆 Best: <b>{bestDay.label}</b> · {fmtMoney(bestDay.revenue)}</div>}
              <div className="pill">📊 Avg / {series.length>90?'month':'day'}: <b>{fmtMoney(Math.round(avgPerDay))}</b></div>
              {wow!=null && <div className="pill" style={{color:wow>=0?'var(--green)':'var(--red)'}}>{wow>=0?'▲':'▼'} Last 7d {Math.abs(wow).toFixed(0)}% vs prior 7d</div>}
              {orders.length>0 && <div className="pill">⏰ Peak hour: <b>{hourLbl(peakHour)}</b></div>}
              <div className="pill">💳 COD share: <b>{pct(s.cod)}%</b></div>
            </div>
          </div>
          <div className="panel">
            <div className="panel-h"><div><div className="panel-t">Payment Mix</div><div className="panel-m">How customers pay</div></div><span className="tag" style={{'--c':'var(--green)'}}>Live</span></div>
            <StatBar items={[{label:'Prepaid',value:s.prepaid||0,color:'var(--green)'},{label:'COD',value:s.cod||0,color:'var(--yellow)'},{label:'Partial',value:s.partial||0,color:'var(--orange)'}]}/>
            <div style={{marginTop:14}}>
              {[['Prepaid','💳',s.prepaid,s.prepaid_revenue,'var(--green)'],['Cash on Delivery','💵',s.cod,s.cod_revenue,'var(--yellow)'],['Partial / Advance','⚡',s.partial,s.partial_revenue,'var(--orange)']].map(([l,ic,c,r,col])=>(
                <div key={l} className="row">
                  <div className="av" style={{background:`color-mix(in srgb,${col} 16%,transparent)`,fontSize:15}}>{ic}</div>
                  <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{l}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{fmtMoney(r||0)}</div></div>
                  <div style={{textAlign:'right'}}><div style={{fontFamily:'Sora',fontWeight:800,fontSize:18,color:col}}>{(c||0).toLocaleString()}</div><div style={{fontSize:10,color:'var(--text-muted)'}}>{pct(c)}%</div></div>
                </div>
              ))}
            </div>
          </div>
        </div>

        <FlowCards orders={orders}/>

        {insights.length>0 && (
          <div className="panel" style={{marginBottom:14}}>
            <div className="panel-h"><div><div className="panel-t">Pattern Intelligence</div><div className="panel-m">Auto-detected from your orders</div></div><span className="tag" style={{'--c':'var(--indigo)'}}>Live analysis</span></div>
            <div className="brain">
              {insights.map((i,k)=>(
                <div key={k} className="bcard" style={{'--c':i.tone}}>
                  <div className="bcard-b"><span style={{fontSize:14}}>{i.icon}</span>{i.badge}</div>
                  <div className="bcard-t">{i.title}</div><div className="bcard-d">{i.detail}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="grid g2">
          <div className="panel">
            <div className="panel-h"><div><div className="panel-t">Order Journey</div><div className="panel-m">Where every order sits right now</div></div></div>
            <div className="rainbow"/>
            {[['Pending',s.pending,'var(--yellow)','⏳'],['Ready / Pickup',(s.ready||0)+(s.pickup||0),'var(--blue)','📦'],['In Transit / OFD',(s.transit||0)+(s.ofd||0),'var(--cyan)','🚚'],['NDR',s.ndr,'var(--orange)','⚠️'],['Delivered',s.delivered,'var(--green)','✅'],['RTO',s.rto,'var(--red)','↩️'],['Cancelled',s.cancelled,'var(--text-dim)','✕']].map(([l,c,col,ic])=>(
              <div key={l} style={{marginBottom:11}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:5,fontSize:12}}>
                  <span style={{color:'var(--text-muted)'}}>{ic} {l}</span>
                  <span><b style={{color:col==='var(--text-dim)'?'var(--text)':col}}>{(c||0).toLocaleString()}</b> <span style={{color:'var(--text-dim)',marginLeft:6}}>{pct(c)}%</span></span>
                </div>
                <div className="bar"><div style={{width:`${pct(c)}%`,background:col}}/></div>
              </div>
            ))}
          </div>
          <div className="panel">
            <div className="panel-h"><div><div className="panel-t">Needs Attention</div><div className="panel-m">Delayed or stuck · orders in selected period</div></div><span className="tag" style={{'--c':derived.stuck.length?'var(--red)':'var(--green)'}}>{derived.stuck.length?`${derived.stuck.length} open`:'All clear'}</span></div>
            {derived.stuck.length>0 && <>
              <div className="atn-chips">
                {ATTN.map(([k,l,c])=>(
                  <button key={k} className={`atn ${attnKey===k?'on':''}`} style={{'--c':c}} onClick={()=>setAttnKey(k)}>{l}<span>{attnCounts[k]||0}</span></button>
                ))}
              </div>
              <div className="atn-bar">
                <div style={{display:'flex',gap:4}}>
                  {[['all','All'],['cod','COD'],['prepaid','Prepaid'],['pp','PP COD']].map(([k,l])=><button key={k} className={`chip ${attnPay===k?'on':''}`} style={{padding:'3px 10px',fontSize:10.5}} onClick={()=>setAttnPay(k)}>{l}</button>)}
                </div>
                <span>{attnList.length} orders · <b>{fmtMoney(Math.round(attnValue))}</b> stuck</span>
              </div>
            </>}
            {derived.stuck.length===0 && <div style={{padding:'34px 0',textAlign:'center',color:'var(--text-muted)',fontSize:13}}>🎉 Nothing is stuck. Nice work.</div>}
            <div style={{maxHeight:420,overflowY:'auto',margin:'0 -6px',padding:'0 6px'}}>
            {attnList.length===0 && derived.stuck.length>0 && <div style={{padding:'28px 0',textAlign:'center',color:'var(--text-muted)',fontSize:13}}>Nothing here for this filter.</div>}
            {attnList.map(({o,days,issue})=>{
              const c = days>=7?'var(--red)':days>=4?'var(--orange)':'var(--yellow)';
              return (
                <div key={o.shopify_id||o.id} className="row" style={{'--c':c}}>
                  <div className="sev"/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>{o.name} <span style={{color:'var(--text-muted)',fontWeight:400}}>· {custName(o)}</span> {payTag(o)}</div>
                    <div style={{fontSize:11,color:'var(--text-muted)'}}>{issue} · {fmtMoney(o.total_price)}</div>
                  </div>
                  <div className="days">{days}<small>days</small></div>
                  <button className="open-btn" onClick={()=>setOpenOrder(o)}>Open</button>
                </div>
              );
            })}
            </div>
          </div>
        </div>

        {derived.topProducts.length>0 && (
          <div className="panel" style={{marginBottom:14}}>
            <div className="panel-h"><div><div className="panel-t">Top Selling Products</div><div className="panel-m">Ranked by units sold</div></div><span className="tag" style={{'--c':'var(--purple)'}}>Trending</span></div>
            <div className="prods">
              {derived.topProducts.map((p,i)=>(
                <div key={p.title} className="prod">
                  <div className="pimg">{imgs[p.pid] ? <img src={imgs[p.pid]} alt={p.title} loading="lazy"/> : <span>{p.title.slice(0,1)}</span>}</div>
                  <div className="rank">{String(i+1).padStart(2,'0')}</div>
                  <div className="prod-t">{p.title}</div>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text-muted)',marginBottom:6}}><span><b style={{color:'var(--text)'}}>{p.qty}</b> sold</span><span>{fmtMoney(p.revenue)}</span></div>
                  <div className="bar"><div style={{width:`${p.qty/derived.topProducts[0].qty*100}%`,background:AV_COLORS[i%AV_COLORS.length]}}/></div>
                </div>
              ))}
            </div>
          </div>
        )}

        <AdsSection ads={ads} err={adsErr} shop={shopBook}/>

        <div className="grid g2">
          <div className="panel">
            <div className="panel-h"><div><div className="panel-t">Order Rhythm</div><div className="panel-m">When customers buy · weekday × hour</div></div><span className="tag" style={{'--c':'var(--indigo)'}}>Heatmap</span></div>
            <Heatmap orders={orders}/>
          </div>
          <div className="panel">
            <div className="panel-h"><div><div className="panel-t">Live Order Feed</div><div className="panel-m">Latest activity</div></div><span className="live"><span className="dot"/>Live</span></div>
            {sortedOrders.slice(0,7).map(o=>(
              <div key={o.shopify_id||o.id} className="feed-i">
                <div className="av" style={{background:avColor(o.name)}}>{custName(o).slice(0,1).toUpperCase()}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600}}>{custName(o)} <span style={{color:'var(--text-dim)',fontWeight:400,fontFamily:'monospace',fontSize:11}}>{o.name}</span></div>
                  <div style={{fontSize:11,color:'var(--text-muted)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{(o.line_items||[]).map(l=>l.title).join(', ')||'—'}</div>
                </div>
                <div style={{textAlign:'right'}}><div style={{fontWeight:700,fontSize:13}}>{fmtMoney(o.total_price)}</div><div style={{marginTop:3}}>{stageBadge(o._stage)}</div></div>
              </div>
            ))}
            {sortedOrders.length===0 && <div style={{padding:30,textAlign:'center',color:'var(--text-muted)',fontSize:13}}>No orders in this period</div>}
          </div>
        </div>

        {derived.geoCovered>=5 && (
          <div className="panel" style={{marginBottom:14}}>
            <div className="panel-h"><div><div className="panel-t">Top Regions</div><div className="panel-m">Delivered vs RTO by state</div></div><span className="tag" style={{'--c':'var(--cyan)'}}>Geo</span></div>
            <div className="states">
              {derived.topCities.map(c=>(
                <div key={c.name} className="st">
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:600,marginBottom:8}}><span>{c.name}</span><span style={{color:'var(--text-muted)'}}>{c.total}</span></div>
                  <div className="bar" style={{marginBottom:5}}><div style={{width:`${c.delivered/c.total*100}%`,background:'var(--green)'}}/></div>
                  <div className="bar"><div style={{width:`${c.rto/c.total*100}%`,background:'var(--red)'}}/></div>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--text-muted)',marginTop:6}}><span>✓ {c.delivered} delivered</span><span>↩ {c.rto} RTO</span></div>
                </div>
              ))}
            </div>
          </div>
        )}

        {audience && audience.segments && audience.segments.length > 0 && (
          <div className="panel" style={{marginBottom:14}}>
            <div className="panel-h"><div><div className="panel-t">Audience Breakdown</div><div className="panel-m">{(audience.total||0).toLocaleString()} orders in period</div></div></div>
            {audience.segments.map(seg=>{
              const p = audience.total ? (seg.count/audience.total*100).toFixed(1) : 0;
              return (
                <div key={seg.id} style={{marginBottom:12}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:5,fontSize:12}}>
                    <span style={{fontWeight:600,display:'flex',alignItems:'center',gap:8}}><span style={{width:8,height:8,borderRadius:'50%',background:seg.color}}/>{seg.name}</span>
                    <span style={{color:'var(--text-muted)'}}>{fmtMoney(seg.revenue)} · <b style={{color:'var(--text)'}}>{seg.count.toLocaleString()}</b> · {p}%</span>
                  </div>
                  <div className="bar"><div style={{width:`${p}%`,background:seg.color}}/></div>
                </div>
              );
            })}
          </div>
        )}
      </>}
      {openOrder && <OrderModal order={openOrder} onClose={()=>setOpenOrder(null)} onUpdated={()=>load(from,to,true)}/>}
    </div>
  );
}

/* ─── Order Modal ────────────────────────────────────────────── */
function OrderModal({ order: initOrder, token: adminToken, onClose, onUpdated }) {
  const [order,setOrder]     = useState(initOrder);
  const [stage,setStage]     = useState(initOrder._stage||'confirmed');
  const [awb,setAwb]         = useState(initOrder._awb||'');
  const [courier,setCourier] = useState(initOrder._courier||'');
  const [saved,setSaved]     = useState({stage:initOrder._stage||'confirmed',awb:initOrder._awb||'',courier:initOrder._courier||''});
  const [partner,setPartner] = useState('delhivery');
  const [shipMode,setMode]   = useState('Surface');
  const [weight,setWeight]   = useState('0.5');
  const [length,setLength]   = useState('15');
  const [breadth,setBreadth] = useState('12');
  const [height,setHeight]   = useState('8');
  const [tag,setTag]         = useState('');
  const [saving,setSaving]   = useState(false);
  const [creating,setCreating] = useState(false);
  const [tagging,setTagging] = useState(false);
  const [msg,setMsg]         = useState(null);
  const [ssStatus,setSsStatus] = useState(null);
  const [ssLoading,setSsLoading] = useState(false);
  const [showShip,setShowShip] = useState(false);
  const [copied,setCopied]   = useState('');
  const scrollRef = useRef();

  useEffect(()=>{
    apiFetch(`/orders/${initOrder.id}`).then(d=>{
      if(!d?.line_items) return;
      const imgMap = {};
      (d.line_items||[]).forEach(li=>{ if(li.product_id && li.image_url) imgMap[li.product_id]=li.image_url; });
      setOrder(prev=>({ ...prev, line_items:(prev.line_items||[]).map(li=>({ ...li, image_url:imgMap[li.product_id]||li.image_url||null })) }));
    }).catch(()=>{});
  },[initOrder.id]);
  useEffect(()=>{
    const onKey = e => e.key==='Escape' && onClose();
    document.addEventListener('keydown',onKey);
    const prevOverflow = document.body.style.overflow; document.body.style.overflow='hidden';
    return ()=>{ document.removeEventListener('keydown',onKey); document.body.style.overflow=prevOverflow; };
  },[]);

  const addr = order.shipping_address || {};
  const cust = order.customer || {};
  const name = `${cust.firstName||cust.first_name||''} ${cust.lastName||cust.last_name||''}`.trim() || addr.name || `${addr.first_name||''} ${addr.last_name||''}`.trim() || 'Customer';
  const phone = (addr.phone || order.phone || cust.phone || '').replace(/\s/g,'');
  const phone10 = phone.replace(/\D/g,'').slice(-10);
  const email = order.email || cust.email || '';
  const fs = (order.financial_status||'').toLowerCase();
  const payBadge = fs==='paid' ? <span className="badge badge-green">Prepaid</span> : fs==='partially_paid' ? <span className="badge" style={{background:'#f59e0b22',color:'var(--yellow)',border:'1px solid #f59e0b55'}}>Partial</span> : <span className="badge badge-yellow">COD</span>;
  const dirty = stage!==saved.stage || awb!==saved.awb || courier!==saved.courier;
  const tags = order.tags || [];
  const items = order.line_items || [];
  const units = items.reduce((a,l)=>a+(l.quantity||1),0);
  const addrText = [addr.address1,addr.address2,addr.city,addr.province||addr.state,addr.zip].filter(Boolean).join(', ');

  const copy = (key,text) => { navigator.clipboard?.writeText(text); setCopied(key); setTimeout(()=>setCopied(''),1400); };
  const go = id => document.getElementById('od-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});

  const saveStage = async () => {
    setSaving(true); setMsg(null);
    try {
      await apiFetch(`/admin/orders/${initOrder.id}/stage`,{method:'PUT',body:JSON.stringify({stage,awb,courier})});
      setSaved({stage,awb,courier}); setMsg({type:'success',text:'Saved — stage updated.'});
      onUpdated && onUpdated();
    } catch(e){setMsg({type:'error',text:e.message});}
    setSaving(false);
  };
  const createShipment = async () => {
    setCreating(true); setMsg(null);
    try {
      const d = await apiFetch(`/admin/orders/${initOrder.id}/create-shipment`,{method:'POST',body:JSON.stringify({
        partner,shipMode,weight:parseFloat(weight)||0.5,length:parseFloat(length)||15,breadth:parseFloat(breadth)||12,height:parseFloat(height)||8
      })});
      setMsg({type:'success',text:`Shipment created · AWB ${d.awb}`});
      setAwb(d.awb); setCourier(d.courier); setStage('pickup'); setSaved({stage:'pickup',awb:d.awb,courier:d.courier});
      onUpdated && onUpdated();
    } catch(e){setMsg({type:'error',text:e.message});}
    setCreating(false);
  };
  const refreshShipsagar = async () => {
    setSsLoading(true); setSsStatus(null);
    try { setSsStatus(await apiFetch(`/admin/orders/${initOrder.id}/shipsagar-status`)); }
    catch(e){ setSsStatus({error:e.message}); }
    setSsLoading(false);
  };
  const applyTag = async (t) => {
    const val = (t||tag).trim(); if(!val) return;
    setTagging(true); setMsg(null);
    try {
      await apiFetch(`/admin/orders/${initOrder.id}/tag`,{method:'POST',body:JSON.stringify({tag:val})});
      setOrder(o=>({...o,tags:[...(o.tags||[]).filter(x=>x!==val),val]}));
      setMsg({type:'success',text:`Tag “${val}” applied.`}); setTag('');
    } catch(e){setMsg({type:'error',text:e.message});}
    setTagging(false);
  };
  const removeTag = async (t) => {
    try {
      await apiFetch(`/admin/orders/${initOrder.id}/tag`,{method:'POST',body:JSON.stringify({tag:t,remove:true})});
      setOrder(o=>({...o,tags:(o.tags||[]).filter(x=>x!==t)}));
    } catch(e){setMsg({type:'error',text:e.message});}
  };

  const FLOW = [['confirmed','Confirmed'],['ready','Packed'],['pickup','Picked up'],['transit','In transit'],['ofd','Out for delivery'],['delivered','Delivered']];
  const flowIdx = FLOW.findIndex(([k])=>k===stage);
  const offFlow = ['new','hold','partial_collected','ndr','rto','cancelled','misc'].includes(stage);
  const offTone = {rto:'var(--red)',cancelled:'var(--red)',ndr:'var(--orange)',hold:'var(--yellow)',new:'var(--text-muted)',partial_collected:'var(--yellow)',misc:'var(--text-muted)'}[stage];
  const STAGES = ['new','hold','confirmed','partial_collected','ready','pickup','transit','ofd','ndr','delivered','rto','cancelled','misc'];
  const stageLabel = s => s==='ofd'?'Out for delivery':s==='partial_collected'?'Partial collected':s==='rto'?'RTO':s==='ndr'?'NDR':s.charAt(0).toUpperCase()+s.slice(1);

  const Row = ({l,v,c,b}) => <div className="od-row" style={{color:c,fontWeight:b?700:400}}><span>{l}</span><span>{v}</span></div>;
  const CopyBtn = ({k,text}) => <button className="od-copy" onClick={()=>copy(k,text)}>{copied===k?'Copied ✓':'Copy'}</button>;

  return (
    <div className="od-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <aside className="od-drawer">
        <header className="od-head">
          <div style={{minWidth:0}}>
            <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
              <div className="od-title">{order.name}</div>
              {stageBadge(stage)}{payBadge}
            </div>
            <div className="od-meta">{new Date(order.created_at).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})} · {name} · {units} item{units!==1?'s':''} · <b>{fmtMoney(order.total_price)}</b></div>
          </div>
          <button className="od-x" onClick={onClose} aria-label="Close">✕</button>
        </header>
        <nav className="od-nav">
          {[['items','Items'],['ship','Shipping'],['customer','Customer'],['tags','Tags']].map(([id,l])=><button key={id} onClick={()=>go(id)}>{l}</button>)}
        </nav>

        <div className="od-scroll" ref={scrollRef}>
          {msg && <div className={`alert alert-${msg.type}`} style={{marginBottom:14}}>{msg.text}</div>}

          <section className="od-card">
            <div className="od-h">Progress</div>
            {offFlow
              ? <div className="od-flag" style={{'--c':offTone}}>● {stageLabel(stage)}</div>
              : <div className="od-flow">
                  {FLOW.map(([k,l],i)=>(
                    <button key={k} className={`od-step ${i<=flowIdx?'done':''} ${i===flowIdx?'cur':''}`} onClick={()=>setStage(k)} title={`Set to ${l}`}>
                      <span className="od-dot">{i<flowIdx?'✓':i+1}</span><span className="od-sl">{l}</span>
                    </button>
                  ))}
                </div>}
            <div className="od-quick">
              <span>Jump to</span>
              {['hold','ndr','rto','cancelled'].map(k=><button key={k} className={`chip ${stage===k?'on':''}`} onClick={()=>setStage(k)}>{stageLabel(k)}</button>)}
              <select value={stage} onChange={e=>setStage(e.target.value)} style={{width:'auto',padding:'5px 10px',fontSize:12,marginLeft:'auto'}}>
                {STAGES.map(s=><option key={s} value={s}>{stageLabel(s)}</option>)}
              </select>
            </div>
          </section>

          <div className="od-cols">
            <div className="od-main">
              <section className="od-card" id="od-items">
                <div className="od-h">Items <span>{units}</span></div>
                {items.map((li,i)=>(
                  <div key={i} className="od-item">
                    {li.image_url
                      ? <img src={li.image_url} alt="" onError={e=>{e.target.style.display='none'}}/>
                      : <div className="od-ph">📦</div>}
                    <div style={{flex:1,minWidth:0}}>
                      <div className="od-it">{li.title}</div>
                      <div className="od-is">{[li.variant_title&&li.variant_title!=='Default Title'?li.variant_title:'',li.sku?`SKU ${li.sku}`:''].filter(Boolean).join(' · ')||'—'}</div>
                    </div>
                    <div style={{textAlign:'right',flexShrink:0}}>
                      <div style={{fontWeight:700,fontSize:13}}>{fmtMoney((li.price||0)*(li.quantity||1))}</div>
                      <div className="od-is">{li.quantity} × {fmtMoney(li.price)}</div>
                    </div>
                  </div>
                ))}
                <div className="od-sum">
                  {order.subtotal_price>0 && <Row l="Subtotal" v={fmtMoney(order.subtotal_price)} c="var(--text-muted)"/>}
                  {order.total_discounts>0 && <Row l={`Discount${order.discount_codes?.[0]?.code?` · ${order.discount_codes[0].code}`:''}`} v={`−${fmtMoney(order.total_discounts)}`} c="var(--green)"/>}
                  {order.total_shipping!=null && <Row l="Shipping" v={order.total_shipping===0?'Free':fmtMoney(order.total_shipping)} c="var(--text-muted)"/>}
                  <div className="od-total"><span>Total</span><span>{fmtMoney(order.total_price)}</span></div>
                  {order.total_paid>0 && <Row l="Paid" v={fmtMoney(order.total_paid)} c="var(--green)" b/>}
                  {order.total_outstanding>0 && <Row l={fs==='partially_paid'?'Balance due on delivery':'To collect (COD)'} v={fmtMoney(order.total_outstanding)} c="var(--red)" b/>}
                </div>
              </section>

              <section className="od-card" id="od-ship">
                <div className="od-h">Shipping &amp; tracking</div>
                <div className="grid-2">
                  <div className="field"><label>AWB / tracking number</label><input value={awb} onChange={e=>setAwb(e.target.value)} placeholder="Tracking number"/></div>
                  <div className="field"><label>Courier</label><input value={courier} onChange={e=>setCourier(e.target.value)} placeholder="e.g. Delhivery, Bluedart"/></div>
                </div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                  {order._tracking_url && <a className="btn-ghost btn-sm" style={{textDecoration:'none',display:'inline-block',padding:'7px 14px',borderRadius:10,border:'1.5px solid var(--border2)',color:'var(--text-muted)',fontSize:12,fontWeight:600}} href={order._tracking_url} target="_blank" rel="noreferrer">Open tracking ↗</a>}
                  {awb && <CopyBtn k="awb" text={awb}/>}
                  <button className="btn-ghost btn-sm" onClick={refreshShipsagar} disabled={ssLoading}>{ssLoading?<><span className="spin">↻</span> Checking…</>:'↻ Live status'}</button>
                </div>
                {ssStatus && (
                  <div className="od-status">
                    {ssStatus.error && <span style={{color:'var(--red)'}}>Error: {ssStatus.error}</span>}
                    {!ssStatus.error && !ssStatus.connected && <span style={{color:'var(--text-muted)'}}>ShipSagar isn’t connected — Settings → Shipping.</span>}
                    {!ssStatus.error && ssStatus.connected && !ssStatus.registered && <span style={{color:'var(--text-muted)'}}>Not registered with ShipSagar{ssStatus.reason==='no_awb'?' — no AWB yet.':'.'}</span>}
                    {!ssStatus.error && ssStatus.connected && ssStatus.registered && !ssStatus.status && <span style={{color:'var(--yellow)'}}>Request sent — refresh in a moment.</span>}
                    {!ssStatus.error && ssStatus.connected && ssStatus.registered && ssStatus.status && <><b>{ssStatus.status}</b><span style={{color:'var(--text-muted)'}}> · maps to {ssStatus.stage}{ssStatus.timestamp?` · ${ssStatus.timestamp}`:''}</span></>}
                  </div>
                )}
                <button className="od-toggle" onClick={()=>setShowShip(s=>!s)}>{showShip?'▾':'▸'} Create shipment via courier API</button>
                {showShip && (
                  <div className="od-sub">
                    <div className="grid-2">
                      <div className="field"><label>Partner</label><select value={partner} onChange={e=>setPartner(e.target.value)}><option value="delhivery">Delhivery</option><option value="shiprocket">Shiprocket</option></select></div>
                      <div className="field"><label>Mode</label><select value={shipMode} onChange={e=>setMode(e.target.value)}><option value="Surface">Surface</option><option value="Express">Express</option></select></div>
                    </div>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
                      <div className="field"><label>Weight kg</label><input type="number" value={weight} onChange={e=>setWeight(e.target.value)} step="0.1" min="0.1"/></div>
                      <div className="field"><label>L cm</label><input type="number" value={length} onChange={e=>setLength(e.target.value)} min="1"/></div>
                      <div className="field"><label>B cm</label><input type="number" value={breadth} onChange={e=>setBreadth(e.target.value)} min="1"/></div>
                      <div className="field"><label>H cm</label><input type="number" value={height} onChange={e=>setHeight(e.target.value)} min="1"/></div>
                    </div>
                    <button className="btn-primary btn-sm" onClick={createShipment} disabled={creating}>{creating?<><span className="spin">↻</span> Creating…</>:'🚚 Create shipment'}</button>
                  </div>
                )}
              </section>

              <section className="od-card" id="od-tags">
                <div className="od-h">Tags <span>{tags.length}</span></div>
                <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:12}}>
                  {tags.length===0 && <span style={{fontSize:12,color:'var(--text-dim)'}}>No tags yet</span>}
                  {tags.map((t,i)=><span key={i} className="od-tag">{t}<button onClick={()=>removeTag(t)} title="Remove">×</button></span>)}
                </div>
                <div style={{display:'flex',gap:8}}>
                  <input value={tag} onChange={e=>setTag(e.target.value)} placeholder="Add a tag and press Enter" onKeyDown={e=>e.key==='Enter'&&applyTag()}/>
                  <button className="btn-primary btn-sm" style={{flexShrink:0}} onClick={()=>applyTag()} disabled={tagging||!tag.trim()}>{tagging?'…':'Add'}</button>
                </div>
              </section>
            </div>

            <div className="od-side">
              <section className="od-card" id="od-customer">
                <div className="od-h">Customer</div>
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
                  <div className="av" style={{background:avColor(name)}}>{name.slice(0,1).toUpperCase()}</div>
                  <div style={{minWidth:0}}><div style={{fontWeight:600,fontSize:14}}>{name}</div>{email && <div className="od-is" style={{overflow:'hidden',textOverflow:'ellipsis'}}>{email}</div>}</div>
                </div>
                {phone10 && (
                  <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:6}}>
                    <a className="od-pill" href={`tel:${phone}`}>📞 {phone10}</a>
                    <a className="od-pill wa" href={`https://wa.me/91${phone10}`} target="_blank" rel="noreferrer">WhatsApp</a>
                  </div>
                )}
                {email && <a className="od-pill" href={`mailto:${email}`} style={{display:'inline-block'}}>✉ Email</a>}
              </section>

              <section className="od-card">
                <div className="od-h">Delivery address {addrText && <CopyBtn k="addr" text={addrText}/>}</div>
                {addrText ? (
                  <div style={{fontSize:13,lineHeight:1.65,color:'var(--text-muted)'}}>
                    <div style={{fontWeight:600,color:'var(--text)'}}>{addr.name||`${addr.first_name||''} ${addr.last_name||''}`.trim()}</div>
                    <div>{addr.address1}{addr.address2?`, ${addr.address2}`:''}</div>
                    <div>{addr.city}, {addr.province||addr.state} {addr.zip}</div>
                  </div>
                ) : <div style={{fontSize:12,color:'var(--text-dim)'}}>No address on file</div>}
              </section>

              <section className="od-card">
                <div className="od-h">Payment</div>
                <div style={{marginBottom:8}}>{payBadge}</div>
                {order.payment_gateway && <div className="od-is">via {order.payment_gateway}</div>}
                <Row l="Total" v={fmtMoney(order.total_price)}/>
                {order.total_paid>0 && <Row l="Paid" v={fmtMoney(order.total_paid)} c="var(--green)"/>}
                {order.total_outstanding>0 && <Row l="Due" v={fmtMoney(order.total_outstanding)} c="var(--red)"/>}
              </section>
            </div>
          </div>
        </div>

        <footer className={`od-save ${dirty?'on':''}`}>
          <span>{dirty?'You have unsaved changes':'All changes saved'}</span>
          <div style={{display:'flex',gap:8}}>
            {dirty && <button className="btn-ghost btn-sm" onClick={()=>{setStage(saved.stage);setAwb(saved.awb);setCourier(saved.courier);}}>Discard</button>}
            <button className="btn-primary btn-sm" onClick={saveStage} disabled={!dirty||saving}>{saving?'Saving…':'Save changes'}</button>
          </div>
        </footer>
      </aside>
    </div>
  );
}

/* ─── Orders ─────────────────────────────────────────────────── */
function Orders({ active=true }) {
  const lastLoad = React.useRef(0);
  const [allOrders,setAllOrders] = useState([]);
  const [loading,setLoading]     = useState(false);
  const [q,setQ]                 = useState('');
  const [stage,setStage]         = useState('');
  const [from,setFrom]           = useState(()=>new Date(Date.now()-30*86400000).toISOString().slice(0,10));
  const [to,setTo]               = useState(()=>new Date().toISOString().slice(0,10));
  const [page,setPage]           = useState(1);
  const [modal,setModal]         = useState(null);
  const [dbStatus,setDbStatus]   = useState(null);
  const [syncing,setSyncing]     = useState(false);
  const PAGE_SIZE = 50;

  const pollDbStatus = React.useCallback(async () => {
    try { const d = await apiFetch('/admin/sync-orders/status'); setDbStatus(d); return d; } catch { return null; }
  }, []);

  React.useEffect(() => { pollDbStatus(); }, []);

  const load = useCallback(async (silent) => {
    if (silent!==true) setLoading(true);
    try {
      const params = new URLSearchParams();
      if(from) params.set('from',from);
      if(to)   params.set('to',to);
      const d = await apiFetch(`/orders?${params}`);
      setAllOrders(d.orders||[]);
      if (silent!==true) setPage(1);
    } catch(e){ console.error(e); }
    finally { setLoading(false); lastLoad.current = Date.now(); }
  },[from,to]);

  useEffect(()=>{ load(); },[from,to]);
  useEffect(()=>{ if (active && lastLoad.current && Date.now()-lastLoad.current > 60000) load(true); },[active]);

  // Client-side filter + search
  const filtered = allOrders.filter(o=>{
    if(stage && o._stage !== stage) return false;
    if(q){
      const lq=q.toLowerCase();
      return o.name.toLowerCase().includes(lq) ||
        ((o.customer?.firstName||'')+' '+(o.customer?.lastName||'')).toLowerCase().includes(lq) ||
        (o.email||'').toLowerCase().includes(lq);
    }
    return true;
  });

  // Stage counts
  const counts = {};
  allOrders.forEach(o=>{ const s=o._stage||'new'; counts[s]=(counts[s]||0)+1; });

  const paged = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  const pages = Math.ceil(filtered.length/PAGE_SIZE);

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <div>
          <h2 style={{fontSize:20,fontWeight:800}}>Orders</h2>
          <p style={{color:'var(--text-muted)',fontSize:13,marginTop:2}}>{filtered.length.toLocaleString()} {stage||'total'} orders</p>
        </div>
        <div style={{display:'flex',gap:6}}>
          <button className="btn-primary btn-sm" onClick={()=>load()}>{loading?<span className="spin">↻</span>:'↻ Refresh'}</button>
          <button className="btn-ghost btn-sm" onClick={async()=>{
            try{ await apiFetch('/admin/sync-tracking',{method:'POST'}); alert('Tracking sync started — stages will update in the background.'); }
            catch(e){ alert('Sync failed: '+e.message); }
          }} title="Sync shipment status from eShipz">🔄 Sync Tracking</button>
          <button className="btn-ghost btn-sm" disabled={syncing} onClick={async()=>{
            if(!confirm('This will pull all orders from Shopify into the database. It may take a few minutes for 5000+ orders. Continue?')) return;
            try{
              await apiFetch('/admin/sync-orders',{method:'POST'});
              setSyncing(true);
              // Poll every 4s until running=false
              const poll = setInterval(async()=>{
                const d = await pollDbStatus();
                if(d && !d.running){ setSyncing(false); clearInterval(poll); load(); }
              }, 4000);
            } catch(e){ alert('Sync failed: '+e.message); }
          }} title="Pull all orders from Shopify into database">
            {syncing ? <span>⏳ Syncing… {dbStatus?.total_in_db ? `(${dbStatus.total_in_db.toLocaleString()} saved)` : ''}</span> : <span>📥 Sync Orders DB {dbStatus?.total_in_db ? `(${dbStatus.total_in_db.toLocaleString()} in DB)` : ''}</span>}
          </button>
        </div>
      </div>
      <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'center'}}>
        <input placeholder="Search order, customer…" value={q} onChange={e=>{setQ(e.target.value);setPage(1);}} style={{flex:'1 1 200px',minWidth:150}}/>
        <DateRangePicker from={from} to={to} onChange={(f,t)=>{setFrom(f);setTo(t);}} />
      </div>
      <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
        {['','new','hold','confirmed','partial_collected','ready','pickup','transit','ofd','ndr','delivered','rto','cancelled','misc'].map(s=>{
          const active = stage===s;
          const count = s==='' ? allOrders.length : (counts[s]||0);
          const label = s===''?'All':s.charAt(0).toUpperCase()+s.slice(1);
          return (
            <button key={s} onClick={()=>{setStage(s);setPage(1);}} style={{
              padding:'5px 12px',borderRadius:20,border:'1px solid '+(active?'var(--pill-border-active)':'var(--border)'),
              background:active?'var(--overlay-4)':'transparent',color:active?'var(--text)':'var(--text-muted)',
              fontSize:12,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',transition:'all .15s',display:'flex',alignItems:'center',gap:5
            }}>
              {label}
              <span style={{background:active?'var(--overlay-5)':'var(--bg-card2)',color:'var(--text)',borderRadius:10,padding:'1px 6px',fontSize:10,fontWeight:700}}>{count}</span>
            </button>
          );
        })}
      </div>
      <div className="card" style={{padding:0,overflow:'auto'}}>
        <table>
          <thead><tr>
            <th>Order</th><th>Date</th><th>Customer</th>
            <th>Items</th><th>Amount</th><th>Payment</th><th>Stage</th><th>AWB</th><th></th>
          </tr></thead>
          <tbody>
            {paged.map(o=>(
              <tr key={o.id} style={{cursor:'pointer'}} onClick={()=>setModal(o)}>
                <td style={{fontWeight:700,fontFamily:'monospace'}}>{o.name}</td>
                <td style={{color:'var(--text-muted)',fontSize:12}}>{fmt(o.created_at)}</td>
                <td>
                  <div>{o.customer?.firstName} {o.customer?.lastName}</div>
                  {o.email && <div style={{fontSize:11,color:'var(--text-muted)'}}>{o.email}</div>}
                </td>
                <td style={{color:'var(--text-muted)',fontSize:12,maxWidth:160}}>
                  {(o.line_items||[]).slice(0,2).map(li=>li.title).join(', ').slice(0,55)}{(o.line_items||[]).length>2?'…':''}
                </td>
                <td style={{fontWeight:600}}>
                  <div>{fmtMoney(o.total_price)}</div>
                  {o.financial_status==='partially_paid' && <div style={{fontSize:11,color:'#f59e0b',marginTop:2}}>Paid {fmtMoney(o.total_paid)} · Due {fmtMoney(o.total_outstanding)}</div>}
                </td>
                <td>
                  {o.financial_status==='paid'
                    ? <span className="badge badge-green">Prepaid</span>
                    : o.financial_status==='partially_paid'
                    ? <span className="badge" style={{background:'#92400e22',color:'#f59e0b',border:'1px solid #f59e0b55'}}>Partial</span>
                    : <span className="badge badge-yellow">COD</span>
                  }
                </td>
                <td>{stageBadge(o._stage)}</td>
                <td style={{fontFamily:'monospace',fontSize:11,color:'var(--text-muted)'}}>{o._awb||'—'}</td>
                <td onClick={e=>e.stopPropagation()}>
                  <button className="btn-ghost btn-sm" onClick={()=>setModal(o)}>Open</button>
                </td>
              </tr>
            ))}
            {!loading && paged.length===0 && <tr><td colSpan={9} style={{textAlign:'center',color:'var(--text-muted)',padding:32}}>No orders found</td></tr>}
            {loading && <tr><td colSpan={9} style={{textAlign:'center',color:'var(--text-muted)',padding:32}}><span className="spin">↻</span> Loading…</td></tr>}
          </tbody>
        </table>
      </div>
      {pages > 1 && (
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,marginTop:14}}>
          <button className="btn-ghost btn-sm" onClick={()=>setPage(p=>p-1)} disabled={page<=1 || loading}>← Prev</button>
          <span style={{fontSize:12,color:'var(--text-muted)',padding:'0 8px'}}>Page {page} of {pages}</span>
          <button className="btn-ghost btn-sm" onClick={()=>setPage(p=>p+1)} disabled={page>=pages || loading}>Next →</button>
        </div>
      )}
      {modal && <OrderModal order={modal} onClose={()=>setModal(null)} onUpdated={()=>load(true)}/>}
    </div>
  );
}

/* ─── Returns ────────────────────────────────────────────────── */
function Returns() {
  const [rrs,setRrs]         = useState([]);
  const [tab,setTab]         = useState('pending');
  const [loading,setLoading] = useState(false);
  const [modal,setModal]     = useState(null);

  const load = async () => {
    setLoading(true);
    try { const d = await apiFetch(`/admin/returns?status=${tab}`); setRrs(d||[]); } finally {setLoading(false);}
  };
  useEffect(()=>{ load(); },[tab]);

  return (
    <div>
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:20,fontWeight:800}}>Returns & Exchanges</h2>
        <p style={{color:'var(--text-muted)',fontSize:13,marginTop:2}}>{rrs.length} requests</p>
      </div>
      <div style={{display:'flex',gap:4,marginBottom:16}}>
        {['pending','approved','rejected','in_progress','completed'].map(t=>(
          <button key={t} onClick={()=>setTab(t)} style={{
            padding:'6px 12px',borderRadius:6,fontSize:12,fontWeight:600,cursor:'pointer',
            border:'1px solid '+(tab===t?'var(--pill-border-active)':'var(--border)'),
            background:tab===t?'var(--overlay-3)':'transparent',color:tab===t?'var(--text)':'var(--text-muted)',textTransform:'capitalize'
          }}>{t.replace('_',' ')}</button>
        ))}
      </div>
      <div className="card" style={{padding:0,overflow:'auto'}}>
        <table>
          <thead><tr><th>ID</th><th>Order</th><th>Type</th><th>Customer</th><th>Reason</th><th>Date</th><th>Status</th><th></th></tr></thead>
          <tbody>
            {rrs.map(rr=>(
              <tr key={rr.request_id}>
                <td style={{fontFamily:'monospace',fontSize:11,color:'var(--text-muted)'}}>{rr.request_id}</td>
                <td style={{fontWeight:600}}>{rr.order_name||'—'}</td>
                <td><span className={`badge ${rr.type==='exchange'?'badge-purple':'badge-cyan'}`}>{rr.type||'return'}</span></td>
                <td style={{color:'var(--text-muted)'}}>{rr.customer_name||'—'}</td>
                <td style={{color:'var(--text-muted)',fontSize:12,maxWidth:140}}>{(rr.reason||'').slice(0,40)}</td>
                <td style={{color:'var(--text-muted)',fontSize:12}}>{fmt(rr.created_at)}</td>
                <td>{stageBadge(rr.status)}</td>
                <td><button className="btn-ghost btn-sm" onClick={()=>setModal(rr)}>Manage</button></td>
              </tr>

          </tbody>
        </table>
      </div>
      {modal && <RRModal rr={modal} onClose={()=>{setModal(null);load();}}/>}
    </div>
  );
}

function RRModal({ rr, onClose }) {
  const [status,setStatus]   = useState(rr.status||'pending');
  const [note,setNote]       = useState(rr.admin_note||'');
  const [partner,setPartner] = useState('delhivery');
  const [saving,setSaving]   = useState(false);
  const [creating,setCreating] = useState('');
  const [msg,setMsg]         = useState(null);
  const [localRr,setLocalRr] = useState(rr);

  const save = async () => {
    setSaving(true); setMsg(null);
    try {
      await apiFetch(`/admin/returns/${rr.request_id}`,{method:'PUT',body:JSON.stringify({status,admin_note:note})});
      setMsg({type:'success',text:'Saved!'});
    } catch(e){setMsg({type:'error',text:e.message});}
    setSaving(false);
  };

  const createShipment = async (direction) => {
    setCreating(direction); setMsg(null);
    try {
      const d = await apiFetch(`/admin/returns/${rr.request_id}/create-shipment`,{method:'POST',body:JSON.stringify({direction,partner,weight:0.5,length:15,breadth:12,height:8})});
      setMsg({type:'success',text:`${direction} shipment created! AWB: ${d.awb}`});
      // Refresh local data
      const field = direction==='reverse'?'reverse_shipment':'forward_shipment';
      setLocalRr(prev=>({...prev,[field]:{awb:d.awb,courier:d.courier,partner,created_at:new Date().toISOString()}}));
    } catch(e){setMsg({type:'error',text:e.message});}
    setCreating('');
  };

  const removeShipment = async (dir) => {
    if(!confirm(`Remove ${dir} shipment?`)) return;
    try {
      await apiFetch(`/admin/returns/${rr.request_id}/shipment/${dir}`,{method:'DELETE'});
      const field = dir==='reverse'?'reverse_shipment':'forward_shipment';
      setLocalRr(prev=>{const n={...prev};delete n[field];return n;});
      setMsg({type:'success',text:'Removed.'});
    } catch(e){setMsg({type:'error',text:e.message});}
  };

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <div>
            <div style={{fontWeight:700,fontSize:15}}>{rr.request_id}</div>
            <div style={{color:'var(--text-muted)',fontSize:12,marginTop:2}}>{rr.type||'Return'} · Order {rr.order_name||''} · {rr.customer_name}</div>
          </div>
          <button onClick={onClose} style={{background:'transparent',border:'1px solid var(--border2)',borderRadius:6,color:'var(--text-muted)',padding:'4px 10px',cursor:'pointer'}}>✕</button>
        </div>
        <div className="modal-body">
          {msg && <div className={`alert alert-${msg.type}`}>{msg.text}</div>}

          {/* Items */}
          {(rr.items||[]).length>0 && (
            <div style={{marginBottom:14}}>
              <div className="section-title">Requested Items</div>
              {(rr.items||[]).map((it,i)=>(
                <div key={i} style={{padding:'7px 0',borderBottom:'1px solid var(--border)',fontSize:13,color:'var(--text-muted)'}}>
                  {it.title}{it.variant_title?` — ${it.variant_title}`:''}{it.qty>1?` ×${it.qty}`:''}
                  {it.exchange_variant_title && (
                    <span style={{marginLeft:8,color:'var(--cyan)',fontWeight:600}}>→ Exchange for: {it.exchange_variant_title}</span>
                  )}
                </div>
              ))}
            </div>
          )}

          {/* Address */}
          {rr.customer_address1 && (
            <div style={{marginBottom:14,background:'var(--bg-card2)',borderRadius:8,padding:'10px 12px',fontSize:12,color:'var(--text-muted)'}}>
              <div style={{fontWeight:700,color:'var(--text)',marginBottom:3}}>📍 Pickup Address</div>
              <div>{rr.customer_address1}, {rr.customer_city} {rr.customer_pincode}</div>
              {rr.customer_phone && <div>{rr.customer_phone}</div>}
            </div>
          )}

          {/* New shipment address (exchange only, if different from pickup) */}
          {rr.shipping_address && (
            <div style={{marginBottom:14,background:'var(--bg-card2)',borderRadius:8,padding:'10px 12px',fontSize:12,color:'var(--text-muted)'}}>
              <div style={{fontWeight:700,color:'var(--cyan)',marginBottom:3}}>📦 New Shipment Address (for exchanged item)</div>
              <div>{rr.shipping_address.address1}, {rr.shipping_address.city}{rr.shipping_address.state?`, ${rr.shipping_address.state}`:''} — {rr.shipping_address.pincode}</div>
            </div>
          )}

          <div className="grid-2" style={{marginBottom:12}}>
            <div className="field">
              <label>Status</label>
              <select value={status} onChange={e=>setStatus(e.target.value)}>
                {['pending','approved','rejected','in_progress','completed'].map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            <div className="field">
              <label>Reason from Customer</label>
              <input value={rr.reason||''} readOnly style={{opacity:.6}}/>
            </div>
          </div>
          <div className="field" style={{marginBottom:12}}>
            <label>Admin Note</label>
            <textarea value={note} onChange={e=>setNote(e.target.value)} rows={2}/>
          </div>
          <button className="btn-primary btn-sm" onClick={save} disabled={saving} style={{marginBottom:18}}>{saving?'Saving…':'Save'}</button>

          <hr style={{border:'none',borderTop:'1px solid var(--border)',margin:'0 0 14px'}}/>
          <div className="section-title">Shipments</div>
          <div className="field" style={{marginBottom:10}}>
            <label>Courier Partner</label>
            <select value={partner} onChange={e=>setPartner(e.target.value)} style={{width:180}}>
              <option value="delhivery">Delhivery</option>
              <option value="shiprocket">Shiprocket</option>
            </select>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {localRr.reverse_shipment
              ? <div style={{fontSize:12,color:'var(--cyan)',padding:'6px 12px',border:'1px solid var(--cyan)33',borderRadius:6,display:'flex',gap:8,alignItems:'center'}}>
                  ↩ {localRr.reverse_shipment.awb}
                  <button onClick={()=>removeShipment('reverse')} style={{background:'none',border:'none',color:'var(--red)',cursor:'pointer',fontSize:12}}>✕</button>
                </div>
              : <button className="btn-ghost btn-sm" onClick={()=>createShipment('reverse')} disabled={!!creating}>
                  {creating==='reverse'?<><span className="spin">↻</span> Creating…</>:'↩ Create Reverse Pickup'}
                </button>
            }
            {rr.type==='exchange' && (
              localRr.forward_shipment
                ? <div style={{fontSize:12,color:'var(--green)',padding:'6px 12px',border:'1px solid var(--green)33',borderRadius:6,display:'flex',gap:8,alignItems:'center'}}>
                    → {localRr.forward_shipment.awb}
                    <button onClick={()=>removeShipment('forward')} style={{background:'none',border:'none',color:'var(--red)',cursor:'pointer',fontSize:12}}>✕</button>
                  </div>
                : <button className="btn-ghost btn-sm" onClick={()=>createShipment('forward')} disabled={!!creating}>
                    {creating==='forward'?<><span className="spin">↻</span> Creating…</>:'→ Create Forward Dispatch'}
                  </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── Emails ─────────────────────────────────────────────────── */
const STAGE_EMAIL_LABELS = {
  confirmed: ['Order Confirmed 🎉', 'Sent when an order moves to Confirmed'],
  pickup: ['Order Shipped 🚚', 'Sent when a courier picks up the order'],
  transit: ['In Transit 📦', 'Sent when tracking shows the shipment in transit'],
  ofd: ['Out for Delivery 🛵', 'Sent when tracking shows out for delivery'],
  delivered: ['Delivered ✅', 'Sent when tracking shows delivered'],
  rto: ['RTO Update', 'Sent when a shipment is returned to origin'],
  partial_collected: ['Partial Payment Collected 💰', 'Sent when a partial COD payment is recorded'],
  hold: ['Order On Hold ⏸', 'Sent when an order sits unconfirmed for 7+ days'],
  ndr: ['Delivery Failed / NDR ⚠️', 'Sent when a delivery attempt fails'],
};

function StageEmailToggles() {
  const [globalOn,setGlobalOn]   = useState(true);
  const [toggles,setToggles]     = useState({});
  const [loading,setLoading]     = useState(true);
  const [msg,setMsg]             = useState(null);

  useEffect(()=>{
    apiFetch('/admin/global-email-enabled').then(d=>setGlobalOn(d?.enabled!==false));
    apiFetch('/admin/stage-email-settings').then(d=>{setToggles(d||{});setLoading(false);}).catch(()=>setLoading(false));
  },[]);

  const setGlobal = async (val) => {
    setGlobalOn(val); setMsg(null);
    try { await apiFetch('/admin/global-email-enabled',{method:'POST',body:JSON.stringify({enabled:val})}); setMsg({type:'success',text:val?'Emails enabled — customers will receive notifications.':'Emails paused — no emails will be sent until you turn this back on.'}); }
    catch(e){ setMsg({type:'error',text:e.message}); setGlobalOn(!val); }
  };

  const toggle = async (stage, val) => {
    setToggles(prev=>({...prev,[stage]:val})); setMsg(null);
    try { await apiFetch('/admin/stage-email-settings',{method:'POST',body:JSON.stringify({stage,enabled:val})}); }
    catch(e){ setMsg({type:'error',text:e.message}); setToggles(prev=>({...prev,[stage]:!val})); }
  };

  return (
    <div className="card" style={{maxWidth:560}}>
      <div style={{fontWeight:700,marginBottom:6}}>Email Notifications</div>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px',background:globalOn?'var(--bg-card2)':'#ef444420',border:'1px solid '+(globalOn?'var(--border)':'#ef4444'),borderRadius:10,marginBottom:16}}>
        <div>
          <div style={{fontWeight:700,fontSize:14}}>{globalOn?'Emails ON':'Emails PAUSED'}</div>
          <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{globalOn?'Customers are receiving notifications':'No emails are being sent — toggle on when ready to go live'}</div>
        </div>
        <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
          <span style={{fontSize:12,color:'var(--text-muted)'}}>{globalOn?'On':'Off'}</span>
          <input type="checkbox" checked={globalOn} onChange={e=>setGlobal(e.target.checked)} style={{width:20,height:20,accentColor:'#111'}}/>
        </label>
      </div>

      {msg && <div className={`alert alert-${msg.type}`} style={{marginBottom:14}}>{msg.text}</div>}

      <div style={{fontWeight:600,fontSize:13,marginBottom:8,opacity:globalOn?1:0.4}}>Per-stage toggles</div>
      <p style={{fontSize:12,color:'var(--text-muted)',marginBottom:12,opacity:globalOn?1:0.4}}>
        Fine-grained control — turn off a specific stage's email without pausing everything.
      </p>
      {loading && <div style={{color:'var(--text-muted)',fontSize:13}}>Loading…</div>}
      {!loading && Object.keys(STAGE_EMAIL_LABELS).map(stage=>{
        const [label,desc] = STAGE_EMAIL_LABELS[stage];
        const enabled = toggles[stage]!==false;
        return (
          <div key={stage} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 12px',background:'var(--bg-card2)',borderRadius:8,marginBottom:8}}>
            <div>
              <div style={{fontWeight:600,fontSize:13}}>{label}</div>
              <div style={{fontSize:11,color:'var(--text-muted)'}}>{desc}</div>
            </div>
            <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
              <input type="checkbox" checked={enabled} onChange={e=>toggle(stage,e.target.checked)} style={{width:18,height:18,accentColor:'#111'}}/>
            </label>
          </div>
        );
      })}
    </div>
  );
}
