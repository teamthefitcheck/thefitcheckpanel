function Waterfall({ p }) {
  const steps = [
    ['Booked',p.booked,'total'],['Cancelled',-p.can.v,'d'],['RTO',-p.rto.v,'d'],['Unrealised',-p.haircut,'d'],['GST',-p.gstAmt,'d'],['Net revenue',p.netRev,'sub'],
    ['COGS',-(p.cogs+p.rtoDamage),'d'],['Shipping',-(p.ship+p.rtoShip),'d'],['Fees',-(p.gateway+p.codFee),'d'],['Packing',-p.packaging,'d'],['Ads',-p.ads,'d'],['Overheads',-p.overheads,'d'],['Net profit',p.net,'end'],
  ];
  const W=920,H=290,pl=10,pr=10,pt=30,pb=34;
  let run=0; const bars=[];
  steps.forEach(([l,v,t],i)=>{
    if(t==='total'){ bars.push({l,a:0,b:v,t,v}); run=v; }
    else if(t==='sub'||t==='end'){ bars.push({l,a:0,b:v,t,v}); run=v; }
    else { const nxt=run+v; bars.push({l,a:run,b:nxt,t,v}); run=nxt; }
  });
  const hi=Math.max(...bars.flatMap(b=>[b.a,b.b]),1), lo=Math.min(...bars.flatMap(b=>[b.a,b.b]),0);
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1));
  const slot=(W-pl-pr)/bars.length, bw=slot*0.62;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
      <line x1={pl} x2={W-pr} y1={y(0)} y2={y(0)} stroke="var(--border2)"/>
      {bars.map((b,i)=>{
        const x=pl+slot*i+(slot-bw)/2, top=y(Math.max(b.a,b.b)), h=Math.max(2,Math.abs(y(b.a)-y(b.b)));
        const col = b.t==='total'?'#5b5bf0' : b.t==='sub'?'#0891b2' : b.t==='end'?(b.v>=0?'#12a150':'#e5484d') : '#f76b15';
        const op = b.t==='d' ? .9 : 1;
        return (<g key={i}>
          {i>0 && <line x1={x-(slot-bw)} x2={x} y1={y(bars[i-1].b)} y2={y(bars[i-1].b)} stroke="var(--border2)" strokeDasharray="2 3"/>}
          <rect x={x} y={top} width={bw} height={h} rx="5" fill={col} opacity={op}/>
          <text x={x+bw/2} y={top-7} textAnchor="middle" fontSize="10.5" fontWeight="700" fill={b.t==='d'?'var(--text-muted)':col}>{b.t==='d'&&b.v<0?'−':''}{inr(Math.abs(b.v)).replace('−','')}</text>
          <text x={x+bw/2} y={H-12} textAnchor="middle" fontSize="10" fill="var(--text-muted)" fontWeight={b.t==='end'?700:400}>{b.l}</text>
        </g>);
      })}
    </svg>
  );
}


function payBreakdown(m, inp, P, avgCost) {
  const n = v => (+v)||0, exp = inp.basis==='expected';
  const gst = n(inp.gst_pct)/100;
  const fI = exp?P.settled:0, fQ = exp?P.settled*(1-P.cancelRate):0;
  const out = [];
  for (const [key,label,icon] of [['prepaid','Prepaid','💳'],['cod','COD','💵'],['pp','PP COD','⚡']]) {
    const g = k => m[k][key];
    const del=g('delivered'), rto=g('rto'), can=g('cancelled'), inf=g('inflight'), pen=g('pending');
    const total = del.n+rto.n+can.n+inf.n+pen.n;
    if (!total) continue;
    const realV = del.v+fI*inf.v+fQ*pen.v, realU = del.u+fI*inf.u+fQ*pen.u, realN = del.n+fI*inf.n+fQ*pen.n;
    const settled = (del.n+rto.n) ? del.n/(del.n+rto.n) : 0;
    const dispN = del.n+rto.n+inf.n+(exp?pen.n*(1-P.cancelRate):0);
    const rtoN = rto.n+(exp?(inf.n+pen.n*(1-P.cancelRate))*(1-P.settled):0);
    const net = realV/(1+gst);
    const cost = realU*avgCost + dispN*(n(inp.ship_fwd)+n(inp.packaging)) + rtoN*n(inp.ship_rto)
      + (key==='prepaid' ? (del.v+rto.v+inf.v+pen.v)*n(inp.gateway_pct)/100 : realV*n(inp.cod_fee_pct)/100);
    const adsShare = P.total ? P.ads*total/P.total : 0;
    const profit = net - cost - adsShare;
    out.push({ key,label,icon,total,realN,rtoRate:(del.n+rto.n)?rto.n/(del.n+rto.n)*100:0,delRate:settled*100,net,cost,adsShare,profit,perOrder:realN?profit/realN:0,aov:total?(del.v+rto.v+can.v+inf.v+pen.v)/total:0, value:del.v+rto.v+can.v+inf.v+pen.v });
  }
  return out;
}

function pnlInsights(P, ctx) {
  const { data, inp, pay, products, avgCost, months, doneN } = ctx;
  const out = [];
  const days = data.days, ohMonthly = (inp.overheads||[]).reduce((s,o)=>s+(+o.amount||0),0);
  const drains = [['Product cost',P.cogs+P.rtoDamage],['Shipping',P.ship+P.rtoShip],['Ads',P.ads],['Overheads',P.overheads],['Payment fees',P.gateway+P.codFee]].sort((a,b)=>b[1]-a[1]);
  if (P.netRev>0) {
    out.push({icon:P.net<0?'🩸':'💰',tone:P.net<0?'var(--red)':'var(--green)',badge:'Bottom line',title:P.net<0?`Losing ${inr(Math.abs(P.net))} this period`:`Earning ${inr(P.net/days)} a day`,detail:`${P.margin.toFixed(1)}% net margin. ${P.net<0?'Cut the biggest drain below or lift AOV.':'Every 100 orders adds about '+inr(P.perOrder*100)+'.'}`});
    out.push({icon:'🕳️',tone:'var(--orange)',badge:'Biggest drain',title:`${drains[0][0]} takes ${(drains[0][1]/P.netRev*100).toFixed(0)}% of revenue`,detail:`${inr(drains[0][1])} out of ${inr(P.netRev)} net revenue. Next: ${drains[1][0]} at ${(drains[1][1]/P.netRev*100).toFixed(0)}%.`});
  }
  const perRto = (+inp.ship_fwd||0)+(+inp.ship_rto||0)+(+inp.packaging||0)+avgCost*(+inp.rto_damage_pct||0)/100;
  if (P.rtoN>0) {
    const cut5 = P.dispN*0.05*perRto;
    out.push({icon:'↩️',tone:'var(--red)',badge:'RTO leak',title:`Every RTO costs you about ${inrFull(perRto)}`,detail:`${Math.round(P.rtoN).toLocaleString()} returns burned ${inr(P.rtoN*perRto)}. Cutting RTO by 5 points would save roughly ${inr(cut5)}.`});
  }
  const pre = pay.find(x=>x.key==='prepaid'), cod = pay.find(x=>x.key==='cod');
  if (pre && cod && pre.realN>0 && cod.realN>0) {
    const better = pre.perOrder>cod.perOrder;
    out.push({icon:'⚖️',tone:'var(--indigo)',badge:'Prepaid vs COD',title:`${better?'Prepaid':'COD'} earns ${inrFull(Math.abs(pre.perOrder-cod.perOrder))} more per order`,detail:`Prepaid ${inrFull(pre.perOrder)} · COD ${inrFull(cod.perOrder)} per order. COD returns ${cod.rtoRate.toFixed(0)}% vs ${pre.rtoRate.toFixed(0)}% prepaid. ${better?'A small prepaid discount can pay for itself.':'COD carries a higher order value, so it still wins — push prepaid only where it lifts conversion.'}`});
  }
  if (P.ads>0 && P.roas) {
    const ok = P.beRoas && P.roas>=P.beRoas;
    out.push({icon:'🎯',tone:ok?'var(--green)':'var(--red)',badge:'Ads',title:ok?`ROAS ${P.roas.toFixed(2)}x beats break-even ${P.beRoas.toFixed(2)}x`:`ROAS ${P.roas.toFixed(2)}x is below break-even ${P.beRoas?P.beRoas.toFixed(2)+'x':'(no contribution)'}`,detail:ok?`Each ₹1 of ads returns ₹${(P.contribution/P.ads).toFixed(2)} of contribution. There is room to scale while ROAS holds.`:`You are paying more for orders than they earn. Pause campaigns under ${P.beRoas?P.beRoas.toFixed(1)+'x':'break-even'} or lower your costs.`});
  }
  const top = products.slice(0,5).map(p=>{ const price=p.units?p.revenue/p.units:0; const net=price/(1+(+inp.gst_pct||0)/100); const c=(inp.product_costs?.[p.title]!==undefined&&inp.product_costs?.[p.title]!==''?+inp.product_costs[p.title]:(+inp.default_cost>0?+inp.default_cost:avgCost)); return {...p,price,mg:net?(net-c)/net*100:0,c}; });
  if (top[0]) out.push({icon:'🔥',tone:'var(--purple)',badge:'Top seller',title:top[0].title,detail:`${top[0].units.toLocaleString()} units, ${inr(top[0].revenue)} revenue, ~${top[0].mg.toFixed(0)}% gross margin${(+inp.default_cost>0||inp.product_costs?.[top[0].title]!==undefined)?'':' (set its cost for a real number)'}.`});
  const weak = top.find(p=>p.mg<35 && p.c>0);
  if (weak) out.push({icon:'🪫',tone:'var(--yellow)',badge:'Margin watch',title:`${weak.title} sells well but earns ~${weak.mg.toFixed(0)}%`,detail:`A ₹${Math.round(weak.price*0.05)} price rise or a ₹${Math.round(weak.c*0.08)} cost cut lifts its margin by about 4 points across ${weak.units.toLocaleString()} units.`});
  const cpo = P.realisedN ? (P.contribution-P.ads)/P.realisedN : 0;
  if (ohMonthly>0 && cpo>0) {
    const needed = ohMonthly/30.44/cpo, cur = P.total/days;
    out.push({icon:'📅',tone:cur>=needed?'var(--green)':'var(--red)',badge:'Break-even',title:`You need ${needed.toFixed(1)} orders/day to cover overheads`,detail:`Currently ${cur.toFixed(1)}/day at ${inrFull(cpo)} contribution per order after ads.`});
  }
  const stuck = P.inf.v+P.pen.v;
  if (stuck>0) out.push({icon:'⏳',tone:'var(--cyan)',badge:'Cash',title:`${inr(stuck)} still in flight`,detail:`${inr(P.inf.v)} is shipped but undelivered and ${inr(P.pen.v)} is waiting to ship. Clearing NDRs and stuck pickups releases it faster.`});
  if (months.length>=2) { const c=months[months.length-1].p, p=months[months.length-2].p; if (p.net) out.push({icon:c.net>=p.net?'📈':'📉',tone:c.net>=p.net?'var(--green)':'var(--red)',badge:'Trend',title:`This month ${c.net>=p.net?'is ahead of':'is behind'} last month`,detail:`${inr(c.net)} so far vs ${inr(p.net)} last month (${months[months.length-2].label}).`}); }
  if (doneN<6) out.push({icon:'🧩',tone:'var(--yellow)',badge:'Accuracy',title:`${6-doneN} cost inputs still empty`,detail:'Until shipping, packaging, COD fee, product cost and overheads are filled, profit is overstated.'});
  return out;
}

function PnL({ active=true }) {
  const now = new Date();
  const [from,setFrom] = useState(()=>`${now.getFullYear()}-${pad2(now.getMonth()+1)}-01`);
  const [to,setTo]     = useState(()=>localKey(now));
  const [data,setData] = useState(null);
  const [loading,setLoading] = useState(true);
  const [inp,setInp]   = useState(null);
  const [saved,setSaved] = useState('');
  const [snaps,setSnaps] = useState([]);
  const [showAll,setShowAll] = useState(false);
  const loaded = useRef(false), saveT = useRef(), last = useRef(0);

  const load = useCallback(async (f,t,silent)=>{
    if(!silent) setLoading(true);
    try { setData(await apiFetch(`/admin/pnl-data?from=${f}&to=${t}`)); } catch(e){ console.error(e); }
    finally { setLoading(false); last.current=Date.now(); }
  },[]);
  useEffect(()=>{ load(from,to); },[from,to]);
  useEffect(()=>{ if(active && last.current && Date.now()-last.current>120000) load(from,to,true); },[active]);
  useEffect(()=>{
    apiFetch('/admin/pnl-settings').then(d=>{ setInp(d); setTimeout(()=>{loaded.current=true;},50); });
    apiFetch('/admin/pnl-snapshots').then(setSnaps).catch(()=>{});
  },[]);
  // autosave inputs
  useEffect(()=>{
    if(!inp || !loaded.current) return;
    setSaved('saving');
    clearTimeout(saveT.current);
    saveT.current = setTimeout(async()=>{
      try { await apiFetch('/admin/pnl-settings',{method:'POST',body:JSON.stringify(inp)}); setSaved('saved'); setTimeout(()=>setSaved(''),1800); }
      catch{ setSaved('error'); }
    },800);
  },[inp]);

  const set = (k,v) => setInp(p=>({...p,[k]:v}));
  const products = data?.products || [];
  const totalUnits = products.reduce((a,p)=>a+p.units,0);
  const explicitCost = t => { const pc=inp?.product_costs?.[t]; if(pc!==undefined && pc!=='') return +pc; return (+inp?.default_cost>0) ? +inp.default_cost : null; };
  const costOf = t => explicitCost(t) ?? 0;
  const costedUnits = products.reduce((a,p)=>a+(explicitCost(p.title)!=null?p.units:0),0);
  const estCost = costedUnits ? products.reduce((a,p)=>a+(explicitCost(p.title)!=null?p.units*explicitCost(p.title):0),0)/costedUnits : 0;
  const avgCost = totalUnits ? products.reduce((a,p)=>a+p.units*(explicitCost(p.title) ?? estCost),0)/totalUnits : 0;
  const adSpend = inp?.ads_mode==='manual' ? (+inp.manual_ads||0) : (data?.ads?.period||0);

  const P = useMemo(()=> (data&&inp) ? computePnl(data.matrix, inp, adSpend, data.days, avgCost) : null, [data,inp,adSpend,avgCost]);

  const months = useMemo(()=>{
    if(!data||!inp) return [];
    const nowD = new Date(); const out=[];
    for(let i=5;i>=0;i--){
      const d = new Date(Date.UTC(nowD.getUTCFullYear(), nowD.getUTCMonth()-i, 1));
      const k = `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}`;
      const m = data.trend?.[k] || PNL_EMPTY();
      const dim = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0)).getUTCDate();
      const days = i===0 ? nowD.getUTCDate() : dim;
      const ads = inp.ads_mode==='manual' ? 0 : (data.ads?.months?.[k]||0);
      out.push({ k, label:d.toLocaleDateString('en-IN',{month:'short',year:'2-digit',timeZone:'UTC'}), p:computePnl(m,inp,ads,days,avgCost) });
    }
    return out;
  },[data,inp,avgCost]);

  const pay = useMemo(()=> (P&&data&&inp) ? payBreakdown(data.matrix, inp, P, avgCost) : [], [P,data,inp,avgCost]);
  const [pimgs,setPimgs] = useState({});
  const topIds = products.slice(0,8).map(p=>p.pid).filter(Boolean).join(',');
  useEffect(()=>{ if(topIds) apiFetch(`/admin/product-images?ids=${topIds}`).then(setPimgs).catch(()=>{}); },[topIds]);

  if(!inp) return <div className="skel" style={{height:400}}/>;

  const filled = [
    ['Product cost', costedUnits>0 && costedUnits/(totalUnits||1)>0.5],
    ['Forward shipping', +inp.ship_fwd>0],
    ['RTO shipping', +inp.ship_rto>0],
    ['COD fee', inp.cod_fee_pct!==''],
    ['Packaging', inp.packaging!==''],
    ['Overheads', (inp.overheads||[]).some(o=>+o.amount>0)],
  ];
  const doneN = filled.filter(x=>x[1]).length;
  const verdict = !P ? '' : doneN<6 ? ['Provisional · costs incomplete','var(--yellow)'] : P.net<0 ? ['Loss-making','var(--red)'] : P.margin<8 ? ['Thin margin','var(--yellow)'] : P.margin<18 ? ['Healthy','var(--green)'] : ['Excellent','var(--green)'];

  const tips = P ? pnlInsights(P,{data,inp,pay,products,avgCost,months,doneN}) : [];

  const saveSnap = async () => {
    const label = prompt('Name this snapshot', `${from} → ${to}`); if(!label) return;
    await apiFetch('/admin/pnl-snapshots',{method:'POST',body:JSON.stringify({label,from,to,basis:inp.basis,inputs:inp,summary:{booked:P.booked,netRev:P.netRev,contribution:P.contribution,ads:P.ads,net:P.net,margin:P.margin,roas:P.roas}})});
    apiFetch('/admin/pnl-snapshots').then(setSnaps);
  };
  const delSnap = async id => { if(!confirm('Delete this snapshot?')) return; await apiFetch(`/admin/pnl-snapshots/${id}`,{method:'DELETE'}); apiFetch('/admin/pnl-snapshots').then(setSnaps); };

  const shown = showAll ? products : products.slice(0,12);

  return (
    <div>
      <div className="d-head">
        <div>
          <div className="d-hello">Profit &amp; <span>Loss</span></div>
          <div className="d-sub">Your real numbers, live from orders, courier outcomes and Meta spend. Fill the blue inputs to sharpen it.</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <span className="pl-saved">{saved==='saving'?'Saving…':saved==='saved'?'✓ Saved':saved==='error'?'Save failed':''}</span>
          <DateRangePicker from={from} to={to} onChange={(f,t)=>{setFrom(f);setTo(t);}}/>
        </div>
      </div>

      {loading || !P ? <div><div className="skel" style={{height:200,marginBottom:14}}/><div className="skel" style={{height:320}}/></div> : <>
        <div className="pl-hero fade">
          <div style={{flex:'1 1 340px'}}>
            <div className="pl-hl">Net profit · {data.days} day{data.days>1?'s':''}</div>
            <div className="pl-big" style={{color:P.net<0?'var(--red)':'var(--green)'}}><CountUp value={P.net} format={v=>inrFull(v)}/></div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginTop:10}}>
              <span className="tag" style={{'--c':verdict[1]}}>{verdict[0]}</span>
              <span style={{fontSize:13,color:'var(--text-muted)'}}><b style={{color:'var(--text)'}}>{P.margin.toFixed(1)}%</b> margin on {inr(P.netRev)} net revenue</span>
            </div>
            <div className="chips" style={{marginTop:16}}>
              <button className={`chip ${inp.basis==='expected'?'on':''}`} onClick={()=>set('basis','expected')} title="Delivered + in-flight orders at your real delivery rate">Expected</button>
              <button className={`chip ${inp.basis==='delivered'?'on':''}`} onClick={()=>set('basis','delivered')} title="Only orders already delivered">Delivered only</button>
              <button className="chip" onClick={saveSnap}>＋ Save snapshot</button>
            </div>
          </div>
          <div className="pl-stats">
            {[['Booked sales',inr(P.booked),`${(P.total).toLocaleString()} orders`],['Net revenue',inr(P.netRev),'after RTO, cancel, GST'],['Contribution',inr(P.contribution),`${P.netRev?(P.contribution/P.netRev*100).toFixed(0):0}% of net revenue`],['Ad spend',inr(P.ads),P.roas?`${P.roas.toFixed(2)}x on realised sales`:'—'],['Profit / order',inrFull(P.perOrder),'per realised order'],['Break-even ROAS',P.beRoas?P.beRoas.toFixed(2)+'x':'—',P.roas&&P.beRoas?(P.roas>=P.beRoas?'you are above it':'below break-even'):'']].map(([l,v,s])=>(
              <div key={l} className="pl-s"><span>{l}</span><b>{v}</b><small>{s}</small></div>
            ))}
          </div>
        </div>

        {doneN<6 && (
          <div className="pl-setup">
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:8}}><b>Complete your P&amp;L — {doneN}/6 inputs filled</b><span style={{color:'var(--text-muted)'}}>Until then costs are understated and profit looks better than it is.</span></div>
            <div className="bar"><div style={{width:`${doneN/6*100}%`,background:'var(--indigo)'}}/></div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:10}}>{filled.map(([l,ok])=><span key={l} className={`pl-chip ${ok?'ok':''}`}>{ok?'✓':'○'} {l}</span>)}</div>
          </div>
        )}

        {tips.length>0 && (
          <div className="panel" style={{marginBottom:14}}>
            <div className="panel-h"><div><div className="panel-t">Founder brief</div><div className="panel-m">What the numbers are telling you · auto-generated from this period</div></div><span className="tag" style={{'--c':'var(--indigo)'}}>{tips.length} insights</span></div>
            <div className="brain">
              {tips.map((i,k)=>(<div key={k} className="bcard" style={{'--c':i.tone}}><div className="bcard-b"><span style={{fontSize:14}}>{i.icon}</span>{i.badge}</div><div className="bcard-t">{i.title}</div><div className="bcard-d">{i.detail}</div></div>))}
            </div>
          </div>
        )}

        <div className="panel" style={{marginBottom:14}}>
          <div className="panel-h"><div><div className="panel-t">Where the money goes</div><div className="panel-m">From booked sales to net profit</div></div><span className="tag" style={{'--c':'var(--indigo)'}}>Waterfall</span></div>
          <Waterfall p={P}/>
        </div>

        <div className="grid g2">
          <div className="panel">
            <div className="panel-h"><div><div className="panel-t">Every ₹100 of net revenue</div><div className="panel-m">Where each rupee ends up</div></div></div>
            {(()=>{ const R=P.netRev||1; const parts=[['Product cost',P.cogs+P.rtoDamage,'#f76b15'],['Shipping',P.ship+P.rtoShip,'#0891b2'],['Fees & packing',P.gateway+P.codFee+P.packaging,'#7c5cfc'],['Ads',P.ads,'#5b5bf0'],['Overheads',P.overheads,'#d98e04'],[P.net>=0?'Profit':'Loss',Math.abs(P.net),P.net>=0?'#12a150':'#e5484d']]; const tot=parts.reduce((s,x)=>s+x[1],0)||1; return (<>
              <div style={{display:'flex',height:26,borderRadius:10,overflow:'hidden',gap:2}}>{parts.map(([l,v,c])=>v>0&&<div key={l} title={`${l}: ${inr(v)}`} style={{flex:v/tot,background:c,minWidth:3}}/>)}</div>
              <div style={{marginTop:14}}>{parts.map(([l,v,c])=>(<div key={l} className="split"><span style={{minWidth:104,display:'flex',alignItems:'center',gap:8}}><i style={{width:9,height:9,borderRadius:3,background:c,display:'inline-block'}}/>{l}</span><span className="fr-b" style={{flex:1}}><i style={{width:`${Math.min(100,v/R*100)}%`,background:c}}/></span><b style={{minWidth:52,textAlign:'right'}}>₹{(v/R*100).toFixed(1)}</b><span className="fr-p" style={{minWidth:64}}>{inr(v)}</span></div>))}</div>
            </>); })()}
          </div>
          <div className="panel">
            <div className="panel-h"><div><div className="panel-t">Unit economics</div><div className="panel-m">One average realised order, start to finish</div></div></div>
            {(()=>{ const N=P.realisedN||1; const aov=P.realisedV/N; const rows=[['Average order (incl. GST)',aov,'#5b5bf0',1],['GST',-P.gstAmt/N,'#94a3b8'],['Product cost',-(P.cogs+P.rtoDamage)/N,'#f76b15'],['Shipping (incl. RTO)',-(P.ship+P.rtoShip)/N,'#0891b2'],['Fees & packaging',-(P.gateway+P.codFee+P.packaging)/N,'#7c5cfc'],['Ads (CAC)',-P.ads/N,'#5b5bf0'],['Overheads',-P.overheads/N,'#d98e04'],['Profit per order',P.net/N,P.net>=0?'#12a150':'#e5484d',1]]; const mx=Math.max(...rows.map(r=>Math.abs(r[1])),1); return rows.map(([l,v,c,strong])=>(
              <div key={l} className="split" style={{fontWeight:strong?700:400}}><span style={{minWidth:150}}>{l}</span><span className="fr-b" style={{flex:1}}><i style={{width:`${Math.abs(v)/mx*100}%`,background:c}}/></span><b style={{minWidth:70,textAlign:'right',color:strong&&v<0?'var(--red)':undefined}}>{v<0&&!strong?'−':''}{inrFull(Math.abs(v)*(strong&&v<0?-1:1))}</b></div>)); })()}
          </div>
        </div>

        <div className="grid g2">
          <div className="panel">
            <div className="panel-h"><div><div className="panel-t">Cash position</div><div className="panel-m">Booked sales by where the money is right now</div></div></div>
            {(()=>{ const segs=[['Delivered · collected',P.del.v,'#12a150'],['Shipped · in flight',P.inf.v,'#0891b2'],['Waiting to ship',P.pen.v,'#d98e04'],['RTO · lost',P.rto.v,'#e5484d'],['Cancelled',P.can.v,'#94a3b8']]; const tot=segs.reduce((s,x)=>s+x[1],0)||1; return (<>
              <div style={{display:'flex',height:26,borderRadius:10,overflow:'hidden',gap:2,marginBottom:14}}>{segs.map(([l,v,c])=>v>0&&<div key={l} style={{flex:v/tot,background:c}} title={`${l}: ${inr(v)}`}/>)}</div>
              {segs.map(([l,v,c])=>(<div key={l} className="split"><span style={{minWidth:150,display:'flex',alignItems:'center',gap:8}}><i style={{width:9,height:9,borderRadius:3,background:c,display:'inline-block'}}/>{l}</span><b style={{flex:1}}>{inr(v)}</b><span className="fr-p">{(v/tot*100).toFixed(0)}%</span></div>))}
            </>); })()}
          </div>
          <div className="panel">
            <div className="panel-h"><div><div className="panel-t">Prepaid vs COD vs PP COD</div><div className="panel-m">Which payment type actually makes money</div></div></div>
            <div style={{overflowX:'auto'}}><table className="pl-tbl"><thead><tr><th>Type</th><th>Orders</th><th>RTO %</th><th>AOV</th><th>Profit / order</th></tr></thead><tbody>
              {pay.map(x=>(<tr key={x.key}><td style={{fontWeight:600}}>{x.icon} {x.label}</td><td>{x.total.toLocaleString()}</td><td style={{color:x.rtoRate>25?'var(--red)':x.rtoRate>15?'var(--yellow)':'var(--green)',fontWeight:700}}>{x.rtoRate.toFixed(1)}%</td><td>{inrFull(x.aov)}</td><td style={{fontWeight:700,color:x.perOrder<0?'var(--red)':'var(--green)'}}>{inrFull(x.perOrder)}</td></tr>))}
            </tbody></table></div>
            <div style={{fontSize:11,color:'var(--text-muted)',marginTop:10,lineHeight:1.5}}>Profit per order includes product cost, shipping, fees, packaging and an even share of ad spend.</div>
          </div>
        </div>

        <div className="pl-cols">
          <div className="panel">
            <div className="panel-h"><div><div className="panel-t">Profit &amp; loss statement</div><div className="panel-m">% is of net revenue · {inp.basis==='expected'?'expected basis':'delivered only'}</div></div></div>
            <div className="pl-sec">Revenue</div>
            <PlLine P={P} l="Booked sales" v={P.booked} t="live" hint="all orders placed"/>
            <PlLine P={P} l="Cancelled orders" v={P.can.v} t="live" neg/>
            <PlLine P={P} l="RTO / returned" v={P.rto.v} t="live" neg/>
            <PlLine P={P} l={inp.basis==='expected'?'Expected shortfall on in-flight':'Not yet delivered'} v={P.haircut} t="calc" neg hint={inp.basis==='expected'?`at ${(P.settled*100).toFixed(0)}% delivery rate`:'excluded'}/>
            <PlLine P={P} l="Realised sales (incl. GST)" v={P.realisedV} strong/>
            <PlLine P={P} l={`GST @ ${inp.gst_pct||0}%`} v={P.gstAmt} t={inp.gst_pct===''?'empty':'input'} neg/>
            <PlLine P={P} l="Net revenue" v={P.netRev} strong sub/>
            <div className="pl-sec">Cost of goods</div>
            <PlLine P={P} l="Product cost" v={P.cogs} t={costedUnits?'input':'empty'} neg hint={`${Math.round(P.realisedU).toLocaleString()} units × ${inrFull(avgCost)} avg${costedUnits<totalUnits&&costedUnits>0?` · ${Math.round(costedUnits/totalUnits*100)}% of units costed, rest estimated at ${inrFull(estCost)}`:''}${costedUnits===0?' · no cost entered':''}`}/>
            <PlLine P={P} l="RTO write-off (damaged stock)" v={P.rtoDamage} t="input" neg hint={`${inp.rto_damage_pct||0}% of returned units`}/>
            <div className="pl-sec">Fulfilment</div>
            <PlLine P={P} l="Forward shipping" v={P.ship} t={+inp.ship_fwd?'input':'empty'} neg hint={`${Math.round(P.dispN).toLocaleString()} shipments`}/>
            <PlLine P={P} l="RTO return shipping" v={P.rtoShip} t={+inp.ship_rto?'input':'empty'} neg hint={`${Math.round(P.rtoN).toLocaleString()} returns`}/>
            <PlLine P={P} l="Packaging" v={P.packaging} t={inp.packaging!==''?'input':'empty'} neg/>
            <div className="pl-sec">Payment fees</div>
            <PlLine P={P} l="Payment gateway (prepaid)" v={P.gateway} t="input" neg/>
            <PlLine P={P} l="COD handling" v={P.codFee} t={inp.cod_fee_pct!==''?'input':'empty'} neg/>
            <PlLine P={P} l="Contribution margin" v={P.contribution} strong sub/>
            <div className="pl-sec">Marketing</div>
            <PlLine P={P} l={inp.ads_mode==='manual'?'Ad spend (manual)':'Meta ad spend'} v={P.ads} t={inp.ads_mode==='manual'?'input':'live'} neg/>
            <PlLine P={P} l="Profit after marketing" v={P.afterAds} strong sub/>
            <div className="pl-sec">Overheads <em style={{textTransform:'none',letterSpacing:0}}>· {inp.prorate_overheads===false?`full monthly amount × ${P.ohFactor} month${P.ohFactor>1?'s':''}`:`monthly amount × ${data.days} of 30.4 days`}</em></div>
            {(inp.overheads||[]).length===0 && <div className="pl-line"><span className="pl-l" style={{color:'var(--text-dim)'}}>None added — add salaries, rent, tools on the right</span><PlTag t="empty"/><span/><span className="pl-v">₹0</span></div>}
            {(inp.overheads||[]).map((o,i)=>(<PlLine P={P} key={i} l={o.name||'Unnamed'} v={(+o.amount||0)*P.ohFactor} t="input" neg hint={`₹${(+o.amount||0).toLocaleString('en-IN')}/month${inp.prorate_overheads===false?'':' · prorated'}`}/>))}
            <div className="pl-net" style={{'--c':P.net<0?'var(--red)':'var(--green)'}}><span>NET PROFIT</span><b>{inrFull(P.net)}</b><em>{P.margin.toFixed(1)}%</em></div>
          </div>

          <div className="pl-side">
            <div className="panel">
              <div className="panel-h"><div><div className="panel-t">Your costs</div><div className="panel-m">Autosaves · blank = not counted</div></div></div>
              <div className="pl-g2"><PlNum inp={inp} set={set} k="ship_fwd" label="Shipping / order" prefix="₹" ph="e.g. 75"/><PlNum inp={inp} set={set} k="ship_rto" label="RTO shipping / return" prefix="₹" ph="e.g. 75"/></div>
              <div className="pl-g2"><PlNum inp={inp} set={set} k="packaging" label="Packaging / order" prefix="₹" ph="e.g. 20"/><PlNum inp={inp} set={set} k="cod_fee_pct" label="COD fee" suffix="%" ph="e.g. 2"/></div>
              <div className="pl-g2"><PlNum inp={inp} set={set} k="gateway_pct" label="Gateway fee (prepaid)" suffix="%"/><PlNum inp={inp} set={set} k="gst_pct" label="GST in prices" suffix="%"/></div>
              <div className="pl-g2"><PlNum inp={inp} set={set} k="rto_damage_pct" label="RTO stock written off" suffix="%"/><PlNum inp={inp} set={set} k="default_cost" label="Default cost / unit" prefix="₹" ph="fallback"/></div>
              <div className="field" style={{marginBottom:0}}>
                <label>Ad spend source</label>
                <div className="chips">
                  <button className={`chip ${inp.ads_mode!=='manual'?'on':''}`} onClick={()=>set('ads_mode','meta')}>Meta live · {inr(data.ads?.period||0)}</button>
                  <button className={`chip ${inp.ads_mode==='manual'?'on':''}`} onClick={()=>set('ads_mode','manual')}>Manual</button>
                </div>
                {inp.ads_mode==='manual' && <div className="pl-in" style={{marginTop:8}}><i>₹</i><input type="number" value={inp.manual_ads} placeholder="Total spend for this period" onChange={e=>set('manual_ads',e.target.value)}/></div>}
                {data.adsErr && inp.ads_mode!=='manual' && <div style={{fontSize:11,color:'var(--red)',marginTop:6}}>Meta unavailable: {data.adsErr}</div>}
              </div>
            </div>
            <div className="panel">
              <div className="panel-h"><div><div className="panel-t">Monthly overheads</div><div className="panel-m">Salaries, rent, software, agency…</div></div><button className="chip" onClick={()=>set('overheads',[...(inp.overheads||[]),{name:'',amount:''}])}>＋ Add</button></div>
              {(inp.overheads||[]).map((o,i)=>(
                <div key={i} style={{display:'flex',gap:6,marginBottom:8}}>
                  <input value={o.name} placeholder="e.g. Salaries" onChange={e=>set('overheads',inp.overheads.map((x,j)=>j===i?{...x,name:e.target.value}:x))}/>
                  <div className="pl-in" style={{flex:'0 0 120px'}}><i>₹</i><input type="number" value={o.amount} placeholder="/ month" onChange={e=>set('overheads',inp.overheads.map((x,j)=>j===i?{...x,amount:e.target.value}:x))}/></div>
                  <button className="btn-ghost btn-sm" onClick={()=>set('overheads',inp.overheads.filter((_,j)=>j!==i))} style={{padding:'0 10px'}}>×</button>
                </div>
              ))}
              <label style={{display:'flex',alignItems:'center',gap:8,fontSize:11.5,color:'var(--text-muted)',fontWeight:400,margin:'4px 0 10px',cursor:'pointer'}}>
                <input type="checkbox" style={{width:'auto'}} checked={inp.prorate_overheads!==false} onChange={e=>set('prorate_overheads',e.target.checked)}/>
                Prorate to the selected days <span style={{color:'var(--text-dim)'}}>(off = count the full monthly amount)</span>
              </label>
              {(inp.overheads||[]).length===0 && <div style={{fontSize:12,color:'var(--text-dim)'}}>No overheads yet. Add your fixed monthly costs so profit is real.</div>}
              {(inp.overheads||[]).length>0 && <div className="od-row" style={{borderTop:'1px solid var(--border)',marginTop:6,paddingTop:8}}><span>Total / month</span><b>{inrFull((inp.overheads||[]).reduce((a,o)=>a+(+o.amount||0),0))}</b></div>}
            </div>
          </div>
        </div>

        <div className="panel" style={{marginBottom:14}}>
          <div className="panel-h"><div><div className="panel-t">Top sellers</div><div className="panel-m">Best products by units · with estimated gross profit</div></div><span className="tag" style={{'--c':'var(--purple)'}}>Trending</span></div>
          <div className="prods">
            {products.slice(0,8).map((p,i)=>{ const price=p.units?p.revenue/p.units:0; const g=1+(+inp.gst_pct||0)/100; const c=explicitCost(p.title) ?? estCost; const mg=price?((price/g)-c)/(price/g)*100:0; const gp=((price/g)-c)*p.units; return (
              <div key={p.title} className="prod">
                <div className="pimg">{pimgs[p.pid]?<img src={pimgs[p.pid]} alt="" loading="lazy"/>:<span>{p.title.slice(0,1)}</span>}</div>
                <div className="rank">{String(i+1).padStart(2,'0')}</div>
                <div className="prod-t">{p.title}</div>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text-muted)',marginBottom:4}}><span><b style={{color:'var(--text)'}}>{p.units}</b> sold</span><span>{inr(p.revenue)}</span></div>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:11.5,fontWeight:700}}><span style={{color:mg<25?'var(--red)':mg<45?'var(--yellow)':'var(--green)'}}>{c?mg.toFixed(0)+'% margin':'set cost'}</span><span>{c?inr(gp):''}</span></div>
              </div>); })}
          </div>
        </div>

        <div className="panel" style={{marginBottom:14}}>
          <div className="panel-h"><div><div className="panel-t">Product profitability</div><div className="panel-m">Set the cost per unit — margin uses this period’s average selling price</div></div><span className="tag" style={{'--c':'var(--purple)'}}>{products.length} products</span></div>
          <div style={{overflowX:'auto'}}>
          <table className="pl-tbl">
            <thead><tr><th>Product</th><th>Units</th><th>Avg price</th><th>Cost / unit</th><th>Margin</th><th>Gross profit</th></tr></thead>
            <tbody>
              {shown.map(p=>{
                const price = p.units? p.revenue/p.units : 0, c = costOf(p.title), set_ = inp.product_costs?.[p.title]!==undefined && inp.product_costs?.[p.title]!=='';
                const mg = price? (price/(1+(+inp.gst_pct||0)/100)-c)/(price/(1+(+inp.gst_pct||0)/100))*100 : 0;
                return (<tr key={p.title}>
                  <td style={{fontWeight:600,maxWidth:260}}>{p.title}</td><td>{p.units.toLocaleString()}</td><td>{inrFull(price)}</td>
                  <td><div className="pl-in" style={{width:110}}><i>₹</i><input type="number" min="0" value={set_?inp.product_costs[p.title]:''} placeholder={inp.default_cost!==''?String(inp.default_cost):'cost'} onChange={e=>set('product_costs',{...inp.product_costs,[p.title]:e.target.value})}/></div></td>
                  <td style={{color:c?(mg<25?'var(--red)':mg<45?'var(--yellow)':'var(--green)'):'var(--text-dim)',fontWeight:700}}>{c?mg.toFixed(0)+'%':'—'}</td>
                  <td style={{fontWeight:600}}>{c?inrFull((price/(1+(+inp.gst_pct||0)/100)-c)*p.units):'—'}</td>
                </tr>);
              })}
            </tbody>
          </table></div>
          {products.length>12 && <button className="chip" style={{marginTop:12}} onClick={()=>setShowAll(s=>!s)}>{showAll?'Show top 12':`Show all ${products.length}`}</button>}
        </div>

        <div className="panel" style={{marginBottom:14}}>
          <div className="panel-h"><div><div className="panel-t">Last 6 months</div><div className="panel-m">Net profit using your current cost inputs and Meta spend per month</div></div><span className="tag" style={{'--c':'var(--green)'}}>Trend</span></div>
          {(()=>{ const mx=Math.max(1,...months.map(x=>Math.abs(x.p.net))); return (
            <div className="pl-months">
              {months.map(({k,label,p})=>(
                <div key={k} className="pl-m">
                  <div className="pl-mb"><div style={{height:`${Math.abs(p.net)/mx*100}%`,background:p.net<0?'var(--red)':'var(--green)',borderRadius:6}}/></div>
                  <b style={{color:p.net<0?'var(--red)':'var(--green)'}}>{inr(p.net)}</b><span>{label}</span><small>{p.margin.toFixed(0)}% · {inr(p.netRev)}</small>
                </div>
              ))}
            </div>); })()}
        </div>

        <div className="panel">
          <div className="panel-h"><div><div className="panel-t">Snapshot log</div><div className="panel-m">Frozen copies of this P&amp;L with the inputs you used</div></div><button className="chip on" onClick={saveSnap}>＋ Save current</button></div>
          {snaps.length===0 && <div style={{fontSize:12,color:'var(--text-dim)',padding:'8px 0'}}>No snapshots yet. Save one at month-end to keep a permanent record.</div>}
          {snaps.map(sn=>(
            <div key={sn._id} className="row" style={{gap:14}}>
              <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:13}}>{sn.label}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{sn.from} → {sn.to} · {sn.basis} · saved {new Date(sn.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</div></div>
              <div style={{textAlign:'right'}}><div style={{fontFamily:'Sora',fontWeight:800,color:(sn.summary?.net||0)<0?'var(--red)':'var(--green)'}}>{inrFull(sn.summary?.net||0)}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{(sn.summary?.margin||0).toFixed(1)}% margin</div></div>
              <button className="btn-ghost btn-sm" onClick={()=>delSnap(sn._id)}>Delete</button>
            </div>
          ))}
        </div>
      </>}
    </div>
  );
}

/* ─── App Shell ───────────────────────────────────────────────── */
function App() {
  const [authed,setAuthed]   = useState(!!token());
  const [tab,setTab]         = useState('dashboard');
  const [visited,setVisited] = useState({dashboard:true});
  const [theme,setThemeState] = useState(getStoredTheme);
  const [iconPreset,setIconPresetState] = useState(getStoredIcons);

  useEffect(() => { applyTheme(theme); }, [theme]);
  useEffect(() => { setVisited(v => v[tab] ? v : { ...v, [tab]: true }); }, [tab]);

  const setTheme = (t) => { setThemeState(t); applyTheme(t); };
  const setIconPreset = (p) => { setIconPresetState(p); localStorage.setItem('fc_icons', p); };

  const logout = async () => {
    try { await apiFetch('/admin/logout',{method:'POST'}); } catch {}
    clearToken(); setAuthed(false);
  };

  if (!authed) return <Login onLogin={()=>setAuthed(true)}/>;

  const views = {
    dashboard: <Dashboard active={tab==='dashboard'}/>, orders: <Orders active={tab==='orders'}/>, returns: <Returns/>,
    emails: <Emails/>, finance: <Finance/>, pnl: <PnL active={tab==='pnl'}/>, shipping: <Shipping/>, synclogs: <SyncLogs/>,
    settings: <Settings theme={theme} setTheme={setTheme} iconPreset={iconPreset} setIconPreset={setIconPreset}/>,
  };

  return (
    <div className="app">
      <Sidebar tab={tab} setTab={setTab} onLogout={logout} iconPreset={iconPreset}/>
      <div className="main">
        <div className="topbar">
          <div className="tb-title">{PAGE_TITLES[tab] || 'Dashboard'}</div>
          <div className="tb-right">
            <span className="live"><span className="dot"/>Synced live</span>
            <button className="icon-btn" title="Toggle light / dark" onClick={()=>setTheme(theme==='light'?'dark':'light')}>{theme==='light'?'☾':'☀'}</button>
          </div>
        </div>
        <div className="page">
          {Object.keys(visited).filter(k=>views[k]).map(k=>(<div key={k} style={{display:k===tab?'block':'none'}}>{views[k]}</div>))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
