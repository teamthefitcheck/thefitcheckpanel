<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fit Check · Admin</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.27.0/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--bg-card:#141414;--bg-card2:#1c1c1c;
  --border:#2a2a2a;--border2:#333;
  --text:#f5f5f5;--text-muted:#888;--text-dim:#555;
  --accent:#ffffff;--accent-dim:#d4d4d4;
  --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--cyan:#06b6d4;--purple:#a78bfa;
  --radius:10px;--radius-sm:6px;
  --sb-bg:#0d0d0d;--sb-border:#1a1a1a;--sb-active:#1e1e1e;--sb-active-border:#2a2a2a;
  --sb-text:#666;--sb-text-active:#fff;
  --overlay-1:#ffffff0d;--overlay-2:#ffffff11;--overlay-3:#ffffff14;--overlay-4:#ffffff18;--overlay-5:#ffffff22;
  --pill-border-active:#555;
}
body[data-theme="bw"]{
  --bg:#000000;--bg-card:#0a0a0a;--bg-card2:#111111;
  --border:#222;--border2:#2a2a2a;
  --text:#ffffff;--text-muted:#666;--text-dim:#444;
  --accent:#ffffff;--accent-dim:#cccccc;
  --green:#ffffff;--red:#ffffff;--yellow:#ffffff;--cyan:#ffffff;--purple:#ffffff;
  --sb-bg:#000;--sb-border:#1c1c1c;--sb-active:#141414;--sb-active-border:#2a2a2a;
  --sb-text:#555;--sb-text-active:#fff;
}
body[data-theme="bw"] .badge-green{background:#ffffff18;color:#fff}
body[data-theme="bw"] .badge-red{background:#ffffff18;color:#fff}
body[data-theme="bw"] .badge-yellow{background:#ffffff18;color:#ccc}
body[data-theme="bw"] .badge-cyan{background:#ffffff18;color:#ccc}
body[data-theme="bw"] .badge-gray{background:#ffffff0e;color:#666}
body[data-theme="bw"] .badge-purple{background:#ffffff18;color:#ccc}
body[data-theme="bw"] .btn-primary{background:#fff;color:#000}
body[data-theme="bw"] input:focus,body[data-theme="bw"] select:focus,body[data-theme="bw"] textarea:focus{border-color:#555}
body[data-theme="light"]{
  --bg:#f5f5f5;--bg-card:#ffffff;--bg-card2:#f0f0f0;
  --border:#e0e0e0;--border2:#d0d0d0;
  --text:#0a0a0a;--text-muted:#666;--text-dim:#999;
  --accent:#000000;--accent-dim:#333;
  --green:#16a34a;--red:#dc2626;--yellow:#d97706;--cyan:#0891b2;--purple:#7c3aed;
  --sb-bg:#ffffff;--sb-border:#e8e8e8;--sb-active:#f0f0f0;--sb-active-border:#d0d0d0;
  --sb-text:#999;--sb-text-active:#000;
  --overlay-1:#0000000a;--overlay-2:#0000000e;--overlay-3:#00000012;--overlay-4:#00000016;--overlay-5:#0000001f;
  --pill-border-active:#999;
}
body[data-theme="light"] .badge-green{background:#16a34a18;color:#16a34a}
body[data-theme="light"] .badge-red{background:#dc262618;color:#dc2626}
body[data-theme="light"] .badge-yellow{background:#d9770618;color:#d97706}
body[data-theme="light"] .badge-cyan{background:#0891b218;color:#0891b2}
body[data-theme="light"] .badge-gray{background:#00000010;color:#666}
body[data-theme="light"] .badge-purple{background:#7c3aed18;color:#7c3aed}
body[data-theme="light"] .btn-primary{background:#000;color:#fff}
body[data-theme="light"] .btn-ghost{border-color:#d0d0d0;color:#666}
body[data-theme="light"] .btn-ghost:hover{border-color:#999;color:#333}
body[data-theme="light"] .btn-danger{border-color:#dc262640;color:#dc2626}
body[data-theme="light"] input,body[data-theme="light"] select,body[data-theme="light"] textarea{background:#fff;border-color:#d0d0d0;color:#0a0a0a}
body[data-theme="light"] input:focus,body[data-theme="light"] select:focus,body[data-theme="light"] textarea:focus{border-color:#666}
body[data-theme="light"] th{color:#999}
body[data-theme="light"] .alert-error{background:#dc262610;border-color:#dc262630;color:#dc2626}
body[data-theme="light"] .alert-success{background:#16a34a10;border-color:#16a34a30;color:#16a34a}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
input,select,textarea{background:var(--bg-card2);border:1.5px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-size:13px;width:100%;outline:none;transition:border-color .15s;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#666}
select option{background:var(--bg-card2);color:var(--text)}
button{cursor:pointer;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;padding:8px 16px;transition:all .15s}
.btn-primary{background:#fff;color:#000;padding:9px 20px}
.btn-primary:hover{background:#e5e5e5}
.btn-ghost{background:transparent;border:1.5px solid var(--border2);color:var(--text-muted);padding:7px 14px}
.btn-ghost:hover{border-color:#555;color:var(--text)}
.btn-danger{background:transparent;border:1.5px solid #ef444455;color:var(--red);padding:7px 14px}
.btn-danger:hover{background:#ef444411}
.btn-sm{padding:5px 12px;font-size:12px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.badge-green{background:#22c55e22;color:var(--green)}
.badge-red{background:#ef444422;color:var(--red)}
.badge-yellow{background:#f59e0b22;color:var(--yellow)}
.badge-cyan{background:#06b6d422;color:var(--cyan)}
.badge-gray{background:#ffffff11;color:var(--text-muted)}
.badge-purple{background:#a78bfa22;color:var(--purple)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;padding:10px 14px;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#ffffff04}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;backdrop-filter:blur(6px)}
.modal{background:var(--bg-card);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:660px;position:relative}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-body{padding:22px 24px;max-height:78vh;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label{font-size:12px;font-weight:600;color:var(--text-muted);letter-spacing:.2px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:12px;margin-bottom:12px}
.alert-error{background:#ef444415;border:1px solid #ef444430;color:var(--red)}
.alert-success{background:#22c55e15;border:1px solid #22c55e30;color:var(--green)}
.spin{display:inline-block;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toggle{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#333;border-radius:22px;cursor:pointer;transition:.2s}
.toggle input:checked+.toggle-slider{background:#fff}
.toggle-slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#888;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px);background:#000}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.section-title{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
/* ═══ Fit Check — design layer (Poppins + Sora, minimal white) ═══ */
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
h1,h2,h3,.sora{font-family:'Sora','Poppins',sans-serif}
body[data-theme="light"]{
  --bg:#f6f6f3;--bg-card:#ffffff;--bg-card2:#f3f3f0;
  --border:#ebebe6;--border2:#dcdcd6;
  --text:#0c0c0d;--text-muted:#6c6c72;--text-dim:#a0a0a6;
  --accent:#0c0c0d;--accent-dim:#333;
  --green:#12a150;--red:#e5484d;--yellow:#d98e04;--cyan:#0891b2;--purple:#7c5cfc;
  --indigo:#5b5bf0;--orange:#f76b15;--blue:#2f6fed;
  --sb-bg:#ffffff;--sb-border:#ebebe6;--sb-active:#0c0c0d;--sb-active-border:#0c0c0d;
  --sb-text:#6c6c72;--sb-text-active:#ffffff;
  --overlay-1:#0000000a;--overlay-2:#0000000e;--overlay-3:#00000012;--overlay-4:#00000016;--overlay-5:#0000001f;
  --pill-border-active:#999;
  --shadow:0 1px 2px rgba(16,16,20,.04),0 4px 16px rgba(16,16,20,.04);
  --shadow-lg:0 12px 40px rgba(16,16,20,.12);
}
body[data-theme="dark"]{--indigo:#818cf8;--orange:#fb923c;--blue:#60a5fa;--shadow:none;--shadow-lg:0 12px 40px rgba(0,0,0,.6)}
body[data-theme="bw"]{--indigo:#fff;--orange:#fff;--blue:#fff;--shadow:none;--shadow-lg:0 12px 40px rgba(0,0,0,.6)}
.card{border-radius:14px;box-shadow:var(--shadow)}
button{border-radius:10px;font-family:inherit}
input,select,textarea{border-radius:10px;font-family:inherit}
.modal{border-radius:18px;box-shadow:var(--shadow-lg)}
.badge{padding:3px 10px;font-size:10.5px}
tr:hover td{background:var(--overlay-1)}
th{font-size:10px;letter-spacing:.9px}

/* shell */
.app{display:flex;min-height:100vh}
.sb{width:236px;flex-shrink:0;background:var(--sb-bg);border-right:1px solid var(--sb-border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-brand{padding:22px 18px 16px;display:flex;align-items:center;gap:11px}
.sb-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#0c0c0d,#3b3b46);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Sora',sans-serif;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(12,12,13,.25);flex-shrink:0}
body[data-theme="dark"] .sb-mark,body[data-theme="bw"] .sb-mark{background:#fff;color:#000;box-shadow:none}
.sb-name{font-family:'Sora',sans-serif;font-weight:800;font-size:15px;letter-spacing:-.4px;color:var(--text)}
.sb-sub{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--text-muted);margin-top:1px}
.sb-label{font-size:9.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-dim);padding:16px 22px 6px}
.sb nav{padding:0 10px}
.ni{width:100%;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--sb-text);background:transparent;border:none;text-align:left;margin-bottom:2px;transition:all .15s}
.ni:hover{background:var(--overlay-2);color:var(--text)}
.ni.on{background:var(--sb-active);color:var(--sb-text-active);font-weight:600;box-shadow:0 4px 14px rgba(12,12,13,.18)}
body[data-theme="dark"] .ni.on,body[data-theme="bw"] .ni.on{background:#fff;color:#000}
.ni .ico{width:18px;display:flex;justify-content:center;opacity:.85}
.sb-foot{margin-top:auto;padding:14px}
.sb-card{background:var(--bg-card2);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:11px;color:var(--text-muted);margin-bottom:10px}
.sb-card b{color:var(--text);font-weight:600;display:block;font-size:12px;margin-bottom:2px}
.main{flex:1;min-width:0}
.topbar{height:58px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.tb-title{font-family:'Sora',sans-serif;font-weight:700;font-size:13px;letter-spacing:1.2px;text-transform:uppercase}
.tb-right{display:flex;align-items:center;gap:12px}
.live{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;color:var(--text-muted);background:var(--bg-card);border:1px solid var(--border);padding:6px 12px;border-radius:99px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,161,80,.5)}70%{box-shadow:0 0 0 8px rgba(18,161,80,0)}100%{box-shadow:0 0 0 0 rgba(18,161,80,0)}}
.icon-btn{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--bg-card);border:1px solid var(--border);color:var(--text-muted);border-radius:99px;font-size:14px}
.icon-btn:hover{color:var(--text);border-color:var(--border2)}
.page{max-width:1240px;margin:0 auto;padding:26px 28px 60px}

/* dashboard */
.d-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.d-hello{font-family:'Sora',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
.d-hello span{background:linear-gradient(90deg,var(--indigo),var(--purple),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.d-sub{font-size:13px;color:var(--text-muted);margin-top:4px}
.ticker{overflow:hidden;border:1px solid var(--border);background:var(--bg-card);border-radius:12px;height:38px;display:flex;align-items:center;margin-bottom:18px;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker-in{display:flex;gap:38px;white-space:nowrap;animation:tick 48s linear infinite;padding-left:20px}
.ticker:hover .ticker-in{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.tk{font-size:12px;color:var(--text-muted);display:flex;gap:8px;align-items:center}
.tk b{color:var(--text);font-weight:600}
.tk i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.6px;padding:2px 7px;border-radius:99px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.kpi{position:relative;overflow:hidden;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:18px 18px 14px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.kpi-l{font-size:10px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center}
.kpi-ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.kpi-v{font-family:'Sora',sans-serif;font-size:27px;font-weight:800;letter-spacing:-1px;margin:10px 0 2px;line-height:1.05}
.kpi-s{max-width:62%;flex-wrap:wrap;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;min-height:18px}
.delta{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px}
.delta.up{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.delta.down{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.kpi svg.spark{position:absolute;right:0;bottom:0;opacity:.9;pointer-events:none}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g21{grid-template-columns:2fr 1fr}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.panel-t{font-family:'Sora',sans-serif;font-size:14px;font-weight:700;letter-spacing:-.2px}
.panel-m{font-size:11px;color:var(--text-muted);margin-top:2px}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.7px;padding:3px 10px;border-radius:99px;text-transform:uppercase;background:color-mix(in srgb,var(--c,var(--indigo)) 12%,transparent);color:var(--c,var(--indigo));border:1px solid color-mix(in srgb,var(--c,var(--indigo)) 26%,transparent)}
.chips{display:flex;gap:6px}
.chip{font-size:11px;font-weight:600;padding:5px 12px;border-radius:99px;background:transparent;border:1px solid var(--border2);color:var(--text-muted)}
.chip.on{background:var(--text);color:var(--bg-card);border-color:var(--text)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;top:0;transform:translate(-50%,-6px);pointer-events:none;background:var(--text);color:var(--bg-card);border-radius:10px;padding:8px 12px;font-size:11px;white-space:nowrap;box-shadow:var(--shadow-lg);z-index:5}
.tip b{display:block;font-family:'Sora',sans-serif;font-size:14px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{font-size:11px;color:var(--text-muted);background:var(--bg-card2);border-radius:99px;padding:6px 12px}
.pill b{color:var(--text);font-weight:600}
.big{border-radius:16px;padding:20px;border:1px solid color-mix(in srgb,var(--c) 22%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 9%,var(--bg-card)),var(--bg-card))}
.big-l{font-size:10px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--text-muted)}
.big-v{font-family:'Sora',sans-serif;font-size:38px;font-weight:800;letter-spacing:-1.5px;color:var(--c);line-height:1;margin:10px 0 4px}
.big-s{font-size:11px;color:var(--text-muted);margin-bottom:12px}
.bar{height:5px;background:var(--overlay-3);border-radius:9px;overflow:hidden}
.bar>div{height:100%;border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.brain{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.brain::-webkit-scrollbar{height:4px}
.bcard{position:relative;overflow:hidden;min-width:250px;max-width:250px;border-radius:14px;padding:16px;border:1px solid color-mix(in srgb,var(--c) 24%,transparent);background:color-mix(in srgb,var(--c) 6%,var(--bg-card))}
.bcard::after{content:'';position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:var(--c);filter:blur(28px);opacity:.16}
.bcard-b{font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--c);margin-bottom:8px;display:flex;gap:6px;align-items:center}
.bcard-t{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:6px}
.bcard-d{font-size:11px;color:var(--text-muted);line-height:1.45}
.rainbow{height:7px;border-radius:9px;background:linear-gradient(90deg,var(--indigo),var(--cyan),var(--green),var(--yellow),var(--orange),var(--red));margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none;padding-bottom:0}
.sev{width:5px;align-self:stretch;border-radius:9px;background:var(--c);flex-shrink:0}
.days{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;color:var(--c);text-align:right;line-height:1}
.days small{display:block;font-family:'Poppins';font-size:9px;font-weight:600;letter-spacing:.7px;color:var(--text-muted);text-transform:uppercase;margin-top:2px}
.prods{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.prods::-webkit-scrollbar{height:4px}
.prod{min-width:170px;max-width:170px;border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--bg-card2);position:relative}
.rank{position:absolute;right:12px;top:10px;font-family:'Sora',sans-serif;font-weight:800;font-size:26px;color:var(--overlay-5);letter-spacing:-1px}
.prod-t{font-size:12.5px;font-weight:600;line-height:1.35;margin:12px 0 8px;min-height:34px}

/* ─── DateRangePicker ───────────────────────────────────────── */
function DateRangePicker({ from, to, onChange }) {
  const [open, setOpen] = React.useState(false);
  const [customFrom, setCustomFrom] = React.useState(from);
  const [customTo, setCustomTo] = React.useState(to);
  const ref = React.useRef();

  React.useEffect(() => {
    function handleClick(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handleClick);
    return () => document.removeEventListener('mousedown', handleClick);
  }, []);

  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);

  function isoDate(d) { return d.toISOString().slice(0,10); }

  const PRESETS = [
    { label: 'Today', get: () => { const d = todayStr; return [d, d]; } },
    { label: 'Yesterday', get: () => { const d = isoDate(new Date(today-86400000)); return [d,d]; } },
    { label: 'Last 7 days', get: () => [isoDate(new Date(today-6*86400000)), todayStr] },
    { label: 'Last 30 days', get: () => [isoDate(new Date(today-29*86400000)), todayStr] },
    { label: 'Last 90 days', get: () => [isoDate(new Date(today-89*86400000)), todayStr] },
    { label: 'This month', get: () => [isoDate(new Date(today.getFullYear(), today.getMonth(), 1)), todayStr] },
    { label: 'Last month', get: () => {
      const f = new Date(today.getFullYear(), today.getMonth()-1, 1);
      const t = new Date(today.getFullYear(), today.getMonth(), 0);
      return [isoDate(f), isoDate(t)];
    }},
    { label: 'This year', get: () => [isoDate(new Date(today.getFullYear(),0,1)), todayStr] },
    { label: 'Last year', get: () => {
      const y = today.getFullYear()-1;
      return [isoDate(new Date(y,0,1)), isoDate(new Date(y,11,31))];
    }},
    { label: 'All time', get: () => ['2020-01-01', todayStr] },
  ];

  function activePreset() {
    for (const p of PRESETS) {
      const [f,t] = p.get();
      if (f === from && t === to) return p.label;
    }
    return null;
  }

  function applyPreset(p) {
    const [f,t] = p.get();
    onChange(f, t);
    setOpen(false);
  }

  function applyCustom() {
    if (customFrom && customTo) { onChange(customFrom, customTo); setOpen(false); }
  }

  function fmtRange(f, t) {
    const ap = activePreset();
    if (ap) return ap;
    const fmt = d => new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    if (!f && !t) return 'All time';
    if (f === t) return fmt(f);
    return `${fmt(f)} – ${fmt(t)}`;
  }

  return (
    <div ref={ref} style={{position:'relative'}}>
      <button onClick={()=>setOpen(o=>!o)} style={{
        background:'var(--bg-card2)', border:'1.5px solid var(--border2)', borderRadius:6,
        color:'var(--text)', fontSize:13, fontWeight:600, padding:'7px 14px',
        display:'flex', alignItems:'center', gap:8, whiteSpace:'nowrap', cursor:'pointer',
        minWidth:180,
      }}>
        <span>📅</span>
        <span style={{flex:1,textAlign:'left'}}>{fmtRange(from,to)}</span>
        <span style={{color:'var(--text-muted)',fontSize:10}}>▾</span>
      </button>
      {open && (
        <div style={{
          position:'absolute', right:0, top:'calc(100% + 6px)', zIndex:500,
          background:'var(--bg-card)', border:'1px solid var(--border2)', borderRadius:10,
          boxShadow:'0 8px 32px rgba(0,0,0,.6)', minWidth:220, overflow:'hidden',
        }}>
          <div style={{padding:'8px 0'}}>
            {PRESETS.map(p => {
              const [f,t] = p.get();
              const active = f===from && t===to;
              return (
                <div key={p.label} onClick={()=>applyPreset(p)} style={{
                  padding:'8px 16px', fontSize:13, cursor:'pointer',
                  background: active ? 'var(--overlay-2)' : 'transparent',
                  color: active ? 'var(--text)' : 'var(--text-muted)',
                  fontWeight: active ? 700 : 400,
                  display:'flex', justifyContent:'space-between', alignItems:'center',
                }}
                onMouseEnter={e=>e.currentTarget.style.background='var(--overlay-1)'}
                onMouseLeave={e=>e.currentTarget.style.background=active?'var(--overlay-2)':'transparent'}>
                  {p.label}
                  {active && <span style={{fontSize:10,color:'var(--green)'}}>✓</span>}
                </div>
              );
            })}
          </div>
          <div style={{borderTop:'1px solid var(--border)',padding:'12px 14px'}}>
            <div style={{fontSize:11,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>Custom range</div>
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <input type="date" value={customFrom} onChange={e=>setCustomFrom(e.target.value)} style={{flex:1,padding:'6px 8px',fontSize:12}}/>
              <span style={{color:'var(--text-muted)',fontSize:12}}>→</span>
              <input type="date" value={customTo} onChange={e=>setCustomTo(e.target.value)} style={{flex:1,padding:'6px 8px',fontSize:12}}/>
            </div>
            <button onClick={applyCustom} className="btn-primary btn-sm" style={{width:'100%',marginTop:8}}>Apply</button>
          </div>
        </div>
      )}
    </div>
  );
}

function useCountUp(target, dur=900) {
  const [v,setV] = useState(0);
  useEffect(()=>{
    let raf, start;
    const step = t => { if(!start) start=t; const p=Math.min(1,(t-start)/dur); setV(target*(1-Math.pow(1-p,3))); if(p<1) raf=requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[target]);
  return v;
}
function CountUp({ value, format }) { const v = useCountUp(value); return <>{format(v)}</>; }

function Spark({ data, color, w=110, h=38 }) {
  if (!data || data.length < 2) return null;
  const max = Math.max(...data,1), min = Math.min(...data,0);
  const x = i => (i/(data.length-1))*w, y = v => h-4-((v-min)/(max-min||1))*(h-10);
  const d = data.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const id = 'sp'+color.replace(/[^a-z0-9]/gi,'');
  return (
    <svg className="spark" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <defs><linearGradient id={id} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={color} stopOpacity=".28"/><stop offset="1" stopColor={color} stopOpacity="0"/></linearGradient></defs>
      <path d={`${d} L${w},${h} L0,${h} Z`} fill={`url(#${id})`}/>
      <path d={d} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function buildSeries(orders, from, to) {
  const start = new Date(from+'T00:00:00'), end = new Date(to+'T00:00:00');
  const days = Math.round((end-start)/86400000)+1;
  const monthly = days > 120;
  const map = new Map();
  for (const o of orders) {
    const day = String(o.created_at).slice(0,10);
    const k = monthly ? day.slice(0,7) : day;
    const e = map.get(k) || { revenue:0, orders:0 };
    e.revenue += o.total_price||0; e.orders++;
    map.set(k,e);
  }
  const out = [];
  if (monthly) {
    const keys = [...map.keys()].sort();
    if (!keys.length) return out;
    let [y,m] = keys[0].split('-').map(Number);
    const [ey,em] = keys[keys.length-1].split('-').map(Number);
    while (y<ey || (y===ey && m<=em)) {
      const k = `${y}-${pad2(m)}`, e = map.get(k)||{revenue:0,orders:0};
      out.push({ ...e, date:`${y}-${pad2(m)}-01`, monthly:true, label:new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'short',year:'2-digit'}) });
      m++; if (m>12) { m=1; y++; }
    }
  } else {
    for (let i=0;i<days;i++) {
      const d = new Date(start.getTime()+i*86400000), e = map.get(localKey(d))||{revenue:0,orders:0};
      out.push({ ...e, date:localKey(d), label:d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) });
    }
  }
  return out;
}

function RevBarChart({ series }) {
  const W=880, H=300, pl=54, pr=44, pt=26, pb=30;

  const rev = series.map(d=>d.revenue), ord = series.map(d=>d.orders);
  const maxR = Math.max(1,...rev)*1.15, maxO = Math.max(1,...ord)*1.25;
  const slot = (W-pl-pr)/n, bw = Math.max(3,Math.min(34,slot*0.64));
  const cx = i => pl + slot*(i+0.5);
  const yR = v => pt + (H-pt-pb)*(1-v/maxR), yO = v => pt + (H-pt-pb)*(1-v/maxO);
  const peak = rev.indexOf(Math.max(...rev));
  const win = Math.min(7,Math.max(2,Math.round(n/6)));
  const ma = rev.map((_,i)=>{ const s=rev.slice(Math.max(0,i-win+1),i+1); return s.reduce((x,y)=>x+y,0)/s.length; });
  const line = (arr,y) => arr.map((v,i)=>`${i?'L':'M'}${cx(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const smooth = (arr,y) => { const p=arr.map((v,i)=>[cx(i),y(v)]); let d=`M${p[0][0]},${p[0][1]}`; for(let i=1;i<p.length;i++){const [x0,y0]=p[i-1],[x1,y1]=p[i],m=(x0+x1)/2;d+=` C${m},${y0} ${m},${y1} ${x1},${y1}`;} return d; };
  const step = Math.max(1,Math.ceil(n/16));
  const isWe = s => !s.monthly && [0,6].includes(new Date(s.date+'T00:00:00').getDay());
  const onMove = e => { const r=e.currentTarget.getBoundingClientRect(); const rel=(e.clientX-r.left)/r.width*W; setHi(Math.max(0,Math.min(n-1,Math.floor((rel-pl)/slot)))); };
  const cur = hi!=null ? series[hi] : null;
  const vsAvg = cur && ma[hi] ? (cur.revenue-ma[hi])/ma[hi]*100 : null;
  return (
    <div>
      <div className="lg">
        <span><i style={{background:'linear-gradient(#7c7cf5,#5b5bf0)'}}/>Revenue</span>
        <span><i style={{background:'transparent',borderTop:'2px dashed var(--yellow)',height:0,borderRadius:0}}/>{win}-period avg</span>
        <span><i style={{background:'var(--orange)',borderRadius:'50%'}}/>Orders (right axis)</span>
        <span>⭐ Peak</span>
        {!series[0].monthly && <span><i style={{background:'var(--yellow)',opacity:.7}}/>Weekend</span>}
      </div>
      <div className="chart">
        <svg viewBox={`0 0 ${W} ${H}`} onMouseMove={onMove} onMouseLeave={()=>setHi(null)} style={{cursor:'crosshair'}}>
          <defs>
            <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#7c7cf5"/><stop offset="1" stopColor="#5b5bf0" stopOpacity=".78"/></linearGradient>
            <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#ff9f5a"/><stop offset="1" stopColor="#f76b15"/></linearGradient>
          </defs>
          {[0,.25,.5,.75,1].map(t=>(<g key={t}>
            <line x1={pl} x2={W-pr} y1={yR(maxR*t)} y2={yR(maxR*t)} stroke="var(--border)" strokeDasharray={t?'3 5':''}/>
            <text x={pl-8} y={yR(maxR*t)+3.5} textAnchor="end" fontSize="10" fill="var(--text-dim)">₹{compact(maxR*t)}</text>
            <text x={W-pr+8} y={yR(maxR*t)+3.5} fontSize="10" fill="var(--orange)" opacity=".8">{Math.round(maxO*t)}</text>
          </g>))}
          {hi!=null && <rect x={pl+slot*hi} y={pt} width={slot} height={H-pt-pb} fill="var(--overlay-2)" rx="4"/>}
          {series.map((s,i)=>{ const h=Math.max(1,(H-pb)-yR(s.revenue)); return (
            <rect key={i} x={cx(i)-bw/2} y={(H-pb)-h} width={bw} height={h} rx={Math.min(5,bw/2)} fill={i===peak?'url(#bg2)':'url(#bg1)'} opacity={hi==null||hi===i?1:.55}/>
          );})}
          <path d={smooth(ma,yR)} fill="none" stroke="var(--yellow)" strokeWidth="2" strokeDasharray="5 4" opacity=".95"/>
          <path d={smooth(ord,yO)} fill="none" stroke="var(--orange)" strokeWidth="2.2" strokeLinecap="round"/>
          {n<=45 && ord.map((v,i)=><circle key={i} cx={cx(i)} cy={yO(v)} r="2.6" fill="var(--bg-card)" stroke="var(--orange)" strokeWidth="1.6"/>)}
          {rev[peak]>0 && <text x={Math.min(W-pr-40,Math.max(pl+20,cx(peak)))} y={yR(rev[peak])-8} textAnchor="middle" fontSize="11" fontWeight="700" fill="var(--orange)">⭐ ₹{compact(rev[peak])}</text>}
          {series.map((s,i)=> i%step===0 && <text key={i} x={cx(i)} y={H-10} textAnchor="middle" fontSize="10" fontWeight={isWe(s)?700:400} fill={isWe(s)?'var(--yellow)':'var(--text-dim)'}>{s.label}</text>)}
        </svg>
        {cur && <div className="tip" style={{left:`${Math.min(88,Math.max(12,cx(hi)/W*100))}%`,top:`${yR(cur.revenue)/H*100}%`}}>
          {cur.label}{isWe(cur)?' · weekend':''}
          <b>{fmtMoney(cur.revenue)}</b>
          <span style={{display:'block',opacity:.8}}>{cur.orders} orders{cur.orders?` · AOV ${fmtMoney(Math.round(cur.revenue/cur.orders))}`:''}</span>
          {vsAvg!=null && <span style={{display:'block',opacity:.8}}>{vsAvg>=0?'▲':'▼'} {Math.abs(vsAvg).toFixed(0)}% vs avg</span>}
        </div>}
      </div>
    </div>
  );
}

function AreaChart({ series, metric, color }) {
  const W=880, H=260, pl=46, pr=12, pt=16, pb=28;
  const [hi,setHi] = useState(null);
  if (!series.length) return <div style={{padding:50,textAlign:'center',color:'var(--text-muted)',fontSize:13}}>No orders in this period</div>;
  const vals = series.map(d=>d[metric]);
  const max = Math.max(1,...vals)*1.15;
  const n = series.length;
  const x = i => pl + (n===1 ? (W-pl-pr)/2 : i*(W-pl-pr)/(n-1));
  const y = v => pt + (H-pt-pb)*(1-v/max);
  const pts = vals.map((v,i)=>[x(i),y(v)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i=1;i<pts.length;i++) { const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2; d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`; }
  const area = `${d} L${x(n-1)},${H-pb} L${x(0)},${H-pb} Z`;
  const ticks = [0,.25,.5,.75,1];
  const step = Math.max(1, Math.ceil(n/7));
  const onMove = e => {
    const r = e.currentTarget.getBoundingClientRect();
    const rel = (e.clientX-r.left)/r.width*W;
    setHi(Math.max(0,Math.min(n-1, Math.round((rel-pl)/((W-pl-pr)/Math.max(1,n-1))))));
  };
  const cur = hi!=null ? series[hi] : null;
  const isMoney = metric!=='orders';
  const fmtV = v => isMoney ? fmtMoney(v) : `${v} orders`;
  return (
    <div className="chart">
      <svg viewBox={`0 0 ${W} ${H}`} onMouseMove={onMove} onMouseLeave={()=>setHi(null)} style={{cursor:'crosshair'}}>
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={color} stopOpacity=".32"/><stop offset="1" stopColor={color} stopOpacity="0"/></linearGradient></defs>
        {ticks.map(t=>(<g key={t}>
          <line x1={pl} x2={W-pr} y1={y(max*t)} y2={y(max*t)} stroke="var(--border)" strokeDasharray={t?'3 5':''}/>
          <text x={pl-8} y={y(max*t)+3.5} textAnchor="end" fontSize="10" fill="var(--text-dim)">{isMoney?'₹'+compact(max*t):Math.round(max*t)}</text>
        </g>))}
        <path d={area} fill="url(#ag)"/>
        <path d={d} fill="none" stroke={color} strokeWidth="2.6" strokeLinecap="round"/>
        {series.map((s,i)=> i%step===0 && <text key={i} x={x(i)} y={H-8} textAnchor="middle" fontSize="10" fill="var(--text-dim)">{s.label}</text>)}
        {hi!=null && <g>
          <line x1={x(hi)} x2={x(hi)} y1={pt} y2={H-pb} stroke={color} strokeOpacity=".35" strokeDasharray="4 4"/>
          <circle cx={x(hi)} cy={y(vals[hi])} r="6" fill="var(--bg-card)" stroke={color} strokeWidth="3"/>
        </g>}
      </svg>
      {cur && <div className="tip" style={{left:`${x(hi)/W*100}%`,top:`${y(vals[hi])/H*100}%`}}>{cur.label}<b>{fmtV(vals[hi])}</b></div>}
    </div>
  );
}

function Heatmap({ orders }) {
  const grid = Array.from({length:7},()=>Array(24).fill(0));
  for (const o of orders) { const d = new Date(o.created_at); grid[(d.getDay()+6)%7][d.getHours()]++; }
  const max = Math.max(1,...grid.flat());
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return (
    <div className="heat">
      <div/>{Array.from({length:24},(_,h)=><div key={h} className="hx">{h%3===0?h:''}</div>)}
      {grid.map((row,di)=>(<React.Fragment key={di}>
        <div className="hl">{days[di]}</div>
        {row.map((c,h)=><div key={h} className="hc" title={`${days[di]} ${h}:00 — ${c} orders`} style={{opacity:c?0.12+0.88*c/max:0.06}}/>)}
      </React.Fragment>))}
    </div>
  );
}

function StatBar({ items }) {
  const total = items.reduce((s,i)=>s+(i.value||0),0);
  if (!total) return null;
  return (
    <div style={{display:'flex',height:8,borderRadius:6,overflow:'hidden',gap:2}}>
      {items.map(i=>i.value>0&&(<div key={i.label} title={`${i.label}: ${i.value}`} style={{flex:i.value,background:i.color,transition:'flex .6s'}}/>))}
    </div>
  );
}

    ['Frequency',o.reach?(o.impressions/o.reach).toFixed(2)+'x':'—'],['Reach',compact(o.reach||0)],
    ['Cost / landing view',o.lpv?fmtMoney(+(sp/o.lpv).toFixed(1)):'—'],['Cost / add to cart',o.atc?fmtMoney(Math.round(sp/o.atc)):'—'],['Cost / checkout',o.ic?fmtMoney(Math.round(sp/o.ic)):'—'],
    ['Click → landing',o.clicks?(o.lpv/o.clicks*100).toFixed(0)+'%':'—'],['Landing → cart',o.lpv?(o.atc/o.lpv*100).toFixed(1)+'%':'—'],['Cart → checkout',o.atc?(o.ic/o.atc*100).toFixed(0)+'%':'—'],['Checkout → buy',o.ic?(o.purchases/o.ic*100).toFixed(0)+'%':'—'],
  ];
  const funnel = [['Impressions',o.impressions],['Clicks',o.clicks],['Landing views',o.lpv],['Add to cart',o.atc],['Checkout',o.ic],['Purchases',o.purchases]];
  const fmax = Math.max(1,o.impressions||1);
